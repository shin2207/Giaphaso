/* ---------- 1) SỨC KHỎE DỮ LIỆU ---------- */
function openDataHealth(){
  if(!members.length){toast('Chưa có dữ liệu');return;}
  const tot=members.length;
  const noBirth=members.filter(m=>!m.birthYear);
  const noPhoto=members.filter(m=>!m.avatar&&!(m.photos&&m.photos.length));
  const noFather=members.filter(m=>!m.parentId&&!(m.spouseId&&(members.find(x=>x.id===m.spouseId)||{}).parentId));
  const deadNoGio=members.filter(m=>isDeceased(m)&&!m.gioDay);
  const noGender=members.filter(m=>!m.gender);
  const filled=members.filter(m=>m.birthYear&&(m.avatar||(m.photos&&m.photos.length))&&m.gender).length;
  const score=Math.round(filled/tot*100);
  const bytes=pdSize(),mb=(bytes/1048576).toFixed(2);
  const sec=(title,arr,hint)=>{
    if(!arr.length)return `<div style="margin:14px 0 2px;font-weight:700;color:#2e7d32">✓ ${title}: đã đủ</div>`;
    const rows=arr.slice(0,300).map(m=>`<div onclick="closePdOverlay('dhRoot');openMemberForm('${m.id}')" style="display:flex;justify-content:space-between;padding:8px 4px;border-bottom:1px solid #e6d6b2;cursor:pointer"><span>${esc(m.name)} <span style="color:#9a7a4a;font-size:11px">· đời ${m.gen||genOf(m)}</span></span><span style="color:#8a1818;font-weight:600">sửa ›</span></div>`).join('');
    return `<div style="margin:18px 0 2px;font-weight:800;color:#8a1818">${title} <span style="color:#b06a2a">(${arr.length})</span></div>${hint?`<div style="font-size:11px;color:#8a6a4a;margin-bottom:4px">${hint}</div>`:''}${rows}`;};
  let html=pdHead('dhRoot','🩺 Sức khỏe dữ liệu');
  html+=`<div style="padding:14px 16px 28px">
    <div style="background:#fff;border-radius:14px;padding:16px;text-align:center;border:1px solid #e6d6b2">
      <div style="font-size:36px;font-weight:800;color:${score>70?'#2e7d32':score>40?'#b06a2a':'#8a1818'}">${score}%</div>
      <div style="color:#7a5a3a;font-size:13px">hồ sơ tương đối đầy đủ (${filled}/${tot} người có năm sinh, ảnh & giới tính)</div></div>
    <div style="margin-top:10px;background:#fff;border-radius:12px;padding:11px 13px;border:1px solid #e6d6b2;font-size:13px;color:#5a3a22">
      💾 Bộ nhớ ảnh/dữ liệu: <b>${mb} MB</b>${bytes>3500000?' <span style="color:#8a1818;font-weight:700">· sắp đầy! nên chuyển ảnh ra kho ngoài</span>':''}</div>
    ${sec('Chưa có năm sinh',noBirth)}
    ${sec('Chưa có ảnh',noPhoto)}
    ${sec('Chưa nối cha/mẹ (gốc rời)',noFather,'Nếu không phải Thuỷ tổ, hãy chọn cha/mẹ để nối vào cây.')}
    ${sec('Đã mất nhưng chưa có ngày giỗ',deadNoGio)}
    ${sec('Chưa ghi giới tính',noGender)}
  </div>`;
  pdOverlay('dhRoot',html);
}

/* ---------- 2) XUẤT CUỐN GIA PHẢ (WORD .doc) ---------- */
function exportGiaPhaWord(){
  if(!members.length){toast('Chưa có dữ liệu');return;}
  const clan=(typeof PD_CLAN!=='undefined'&&PD_CLAN)?PD_CLAN:'Tộc Nguyễn Như';
  const byId={};members.forEach(m=>byId[m.id]=m);
  const groups={};members.forEach(m=>{const g=m.gen||genOf(m);(groups[g]=groups[g]||[]).push(m);});
  const gens=Object.keys(groups).map(Number).sort((a,b)=>a-b);
  const xe=s=>String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  const run=(t,o)=>{o=o||{};return `<w:r><w:rPr><w:rFonts w:ascii="Times New Roman" w:hAnsi="Times New Roman" w:cs="Times New Roman"/>${o.b?'<w:b/>':''}${o.i?'<w:i/>':''}${o.color?`<w:color w:val="${o.color}"/>`:''}${o.sz?`<w:sz w:val="${o.sz}"/><w:szCs w:val="${o.sz}"/>`:''}</w:rPr><w:t xml:space="preserve">${xe(t)}</w:t></w:r>`;};
  const brk='<w:r><w:br/></w:r>';
  const para=(runs,o)=>{o=o||{};return `<w:p><w:pPr>${o.pb?'<w:pageBreakBefore/>':''}<w:spacing w:before="${o.before||0}" w:after="${o.after||0}" w:line="276" w:lineRule="auto"/>${o.ind?`<w:ind w:left="${o.ind}"/>`:''}${o.align?`<w:jc w:val="${o.align}"/>`:''}</w:pPr>${runs}</w:p>`;};
  let body='';
  body+=para(run('GIA PHẢ',{b:1,color:'8A1818',sz:64}),{align:'center',before:2600,after:120});
  body+=para(run(clan,{b:1,color:'5A2B13',sz:36}),{align:'center',after:300});
  body+=para(run('\u201CN\u01b0\u1edbc c\u00f3 qu\u1ed1c s\u1eed, nh\u00e0 c\u00f3 gia ph\u1ea3.\u201D',{i:1,sz:28}),{align:'center',after:200});
  body+=para(run(members.length+' th\u00e0nh vi\u00ean \u00b7 '+gens.length+' \u0111\u1eddi',{sz:24}),{align:'center',after:120});
  body+=para(run('L\u1eadp ng\u00e0y '+new Date().toLocaleDateString('vi-VN'),{sz:22,color:'7A6A52'}),{align:'center'});
  gens.forEach(g=>{
    body+=para(run('\u0110\u1edcI TH\u1ee8 '+g,{b:1,color:'8A1818',sz:32}),{pb:true,before:120,after:120});
    groups[g].slice().sort((a,b)=>a.name.localeCompare(b.name,'vi')).forEach(m=>{
      const sp=m.spouseId?byId[m.spouseId]:null,par=m.parentId?byId[m.parentId]:null;
      const kids=members.filter(x=>x.parentId===m.id);
      const yrs=[m.birthYear,m.deathYear].filter(Boolean).join(' \u2013 ');
      const gio=m.gioDay?(m.gioDay+'/'+m.gioMonth+(m.gioType==='duong'?' (d\u01b0\u01a1ng l\u1ecbch)':' (\u00e2m l\u1ecbch)')):'';
      body+=para(run(m.name,{b:1,sz:26,color:'8A1818'})+(yrs?run('  ('+yrs+')',{sz:22,color:'7A6A52'}):''),{before:160,after:30});
      const L=[];
      if(par)L.push(['Con c\u1ee7a: ',par.name]);
      if(sp)L.push(['V\u1ee3/ch\u1ed3ng: ',sp.name]);
      if(kids.length)L.push(['C\u00e1c con: ',kids.map(k=>k.name).join(', ')]);
      if(gio)L.push(['Ng\u00e0y gi\u1ed7: ',gio]);
      if(m.hometown)L.push(['Qu\u00ea qu\u00e1n: ',m.hometown]);
      if(m.occupation)L.push(['Ngh\u1ec1 nghi\u1ec7p: ',m.occupation]);
      if(m.phone)L.push(['\u0110i\u1ec7n tho\u1ea1i: ',m.phone]);
      if(m.address)L.push(['\u0110\u1ecba ch\u1ec9: ',m.address]);
      if(m.grave)L.push(['M\u1ed9 ph\u1ea7n: ',m.grave]);
      if(L.length){let rr='';L.forEach((pr,i)=>{rr+=(i?brk:'')+run(pr[0],{sz:22,color:'9A7A4A'})+run(pr[1],{sz:22});});body+=para(rr,{ind:360,after:30});}
      if(m.notes)body+=para(run(m.notes,{i:1,sz:22}),{ind:360,after:60});
    });
  });
  const docXml='<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<w:document xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main"><w:body>'+body+'<w:sectPr><w:pgSz w:w="11906" w:h="16838"/><w:pgMar w:top="1418" w:right="1418" w:bottom="1418" w:left="1418" w:header="709" w:footer="709" w:gutter="0"/></w:sectPr></w:body></w:document>';
  const ct='<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/></Types>';
  const rels='<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/></Relationships>';
  const enc=new TextEncoder();
  const crcTable=(function(){const t=[];for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=(c&1)?(0xEDB88320^(c>>>1)):(c>>>1);t[n]=c>>>0;}return t;})();
  const crc32=u=>{let c=0xFFFFFFFF;for(let i=0;i<u.length;i++)c=crcTable[(c^u[i])&0xFF]^(c>>>8);return (c^0xFFFFFFFF)>>>0;};
  const u16=n=>[n&255,(n>>8)&255],u32=n=>[n&255,(n>>8)&255,(n>>16)&255,(n>>24)&255];
  const files=[{n:'[Content_Types].xml',d:enc.encode(ct)},{n:'_rels/.rels',d:enc.encode(rels)},{n:'word/document.xml',d:enc.encode(docXml)}];
  const parts=[],central=[];let off=0;
  files.forEach(f=>{const name=enc.encode(f.n),data=f.d,crc=crc32(data);
    parts.push(new Uint8Array([0x50,0x4b,0x03,0x04,...u16(20),...u16(0),...u16(0),...u16(0),...u16(0),...u32(crc),...u32(data.length),...u32(data.length),...u16(name.length),...u16(0)]),name,data);
    central.push(new Uint8Array([0x50,0x4b,0x01,0x02,...u16(20),...u16(20),...u16(0),...u16(0),...u16(0),...u16(0),...u32(crc),...u32(data.length),...u32(data.length),...u16(name.length),...u16(0),...u16(0),...u16(0),...u16(0),...u32(0),...u32(off)]),name);
    off+=30+name.length+data.length;});
  let cdSize=0;central.forEach(c=>cdSize+=c.length);
  const eocd=new Uint8Array([0x50,0x4b,0x05,0x06,...u16(0),...u16(0),...u16(files.length),...u16(files.length),...u32(cdSize),...u32(off),...u16(0)]);
  const all=parts.concat(central,[eocd]);let total=0;all.forEach(a=>total+=a.length);
  const out=new Uint8Array(total);let p=0;all.forEach(a=>{out.set(a,p);p+=a.length;});
  const blob=new Blob([out],{type:'application/vnd.openxmlformats-officedocument.wordprocessingml.document'});
  const url=URL.createObjectURL(blob),a=document.createElement('a');
  a.href=url;a.download='Cuon-gia-pha.docx';document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),1500);
  toast('\u0110\u00e3 xu\u1ea5t cu\u1ed1n gia ph\u1ea3 (.docx) \u2014 m\u1edf \u0111\u01b0\u1ee3c m\u1ecdi n\u01a1i');
}

/* ---------- 3) LỊCH GIỖ CẢ NĂM ---------- */
function openGioCalendar(){
  const _sg=new Set();const all=members.filter(m=>m.gioDay&&m.gioMonth).filter(m=>{const k=noTone(m.name)+'|'+(m.birthYear||'')+'|'+(m.deathYear||'')+'|'+m.gioDay+'/'+m.gioMonth+'/'+(m.gioType||'am');if(_sg.has(k))return false;_sg.add(k);return true;});
  if(!all.length){pdOverlay('gioCalRoot',pdHead('gioCalRoot','📅 Lịch giỗ cả năm')+'<div style="padding:30px;text-align:center;color:#7a5a3a">Chưa có ngày giỗ nào.<br>Thêm "Ngày giỗ" trong hồ sơ người đã mất để hiện ở đây.</div>');return;}
  const byMonth={};all.forEach(m=>{(byMonth[m.gioMonth]=byMonth[m.gioMonth]||[]).push(m);});
  let html=pdHead('gioCalRoot','📅 Lịch giỗ cả năm · '+all.length+' giỗ');
  html+='<div style="padding:4px 14px 8px;color:#8a6a4a;font-size:12px">Sắp theo ngày âm lịch trong năm — từ tháng Giêng đến tháng Chạp.</div><div style="padding:0 14px 28px">';
  for(let mo=1;mo<=12;mo++){if(!byMonth[mo])continue;
    const rows=byMonth[mo].slice().sort((a,b)=>(a.gioDay-b.gioDay)||a.name.localeCompare(b.name,'vi')).map(m=>{const am=m.gioType!=='duong';
      return `<div onclick="closePdOverlay('gioCalRoot');openMemberDetail('${m.id}')" style="display:flex;gap:10px;align-items:center;padding:9px 4px;border-bottom:1px solid #e6d6b2;cursor:pointer">
        <div style="min-width:52px;font-weight:800;color:#8a1818">${m.gioDay}/${m.gioMonth}</div>
        <div style="flex:1"><div style="font-weight:600">🕯️ ${esc(m.name)}</div>
        <div style="font-size:11px;color:#8a6a4a">đời ${m.gen||genOf(m)} · ${am?'âm lịch':'dương lịch'}${(function(){const _d=gioSolarThisYear(m);return _d?' · nhằm '+_d.getDate()+'/'+(_d.getMonth()+1)+'/'+_d.getFullYear()+' DL':'';})()}</div></div></div>`;}).join('');
    html+=`<div style="margin-top:16px;font-weight:800;color:#8a1818;font-size:15px;border-bottom:2px solid #c9982f;padding-bottom:3px">Tháng ${mo}${mo===1?' (Giêng)':mo===12?' (Chạp)':''}</div>${rows}`;}
  html+='</div>';
  pdOverlay('gioCalRoot',html);
}

/* ---------- 4) ALBUM ẢNH + TÀI LIỆU ---------- */
function resizePhoto(file,cb){const r=new FileReader();r.onload=e=>{const img=new Image();
  img.onload=()=>{const max=1000,sc=Math.min(1,max/Math.max(img.width,img.height));
    const cw=Math.round(img.width*sc),ch=Math.round(img.height*sc);
    const cv=document.createElement('canvas');cv.width=cw;cv.height=ch;cv.getContext('2d').drawImage(img,0,0,cw,ch);
    cb(cv.toDataURL('image/jpeg',0.78));};img.src=e.target.result;};r.readAsDataURL(file);}
function pdAlbumSection(m){
  const ph=(m.photos||[]),dc=(m.docs||[]);
  if(!ph.length&&!dc.length)return `<div class="prof-sec"><h3>📷 Hình ảnh & tài liệu</h3><div style="color:var(--ink-soft);font-size:13px">Chưa có. Bấm <b>📷 Album</b> bên dưới để thêm ảnh tổ tiên, từ đường, mộ phần, ảnh chụp sách cũ…</div></div>`;
  const imgs=ph.map(p=>`<img src="${esc(p)}" onclick="openAlbum('${m.id}')" style="width:72px;height:72px;object-fit:cover;border-radius:10px;border:1px solid #d8c49a;cursor:pointer">`).join('');
  const docs=dc.map(d=>`<a href="${esc(d.data)}" download="${esc(d.name)}" style="display:inline-block;background:#fff;border:1px solid #d8c49a;border-radius:8px;padding:6px 10px;margin:3px 3px 0 0;font-size:12px;text-decoration:none;color:#5a3a22">📎 ${esc(d.name)}</a>`).join('');
  return `<div class="prof-sec"><h3>📷 Hình ảnh & tài liệu</h3><div style="display:flex;flex-wrap:wrap;gap:6px">${imgs}</div>${docs?`<div style="margin-top:6px">${docs}</div>`:''}</div>`;
}
function openAlbum(id){const m=members.find(x=>x.id===id);if(!m)return;m.photos=m.photos||[];m.docs=m.docs||[];
  const bytes=pdSize(),mb=(bytes/1048576).toFixed(2);
  const imgs=m.photos.map((p,i)=>`<div style="position:relative"><img src="${esc(p)}" style="width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px;border:1px solid #d8c49a"><button onclick="albDelPhoto('${id}',${i})" style="position:absolute;top:4px;right:4px;background:#8a1818;color:#fff;border:none;border-radius:50%;width:24px;height:24px;cursor:pointer;line-height:1">✕</button></div>`).join('')||'<div style="color:#9a7a4a;grid-column:1/-1;padding:8px">Chưa có ảnh nào</div>';
  const docs=m.docs.map((d,i)=>`<div style="display:flex;justify-content:space-between;align-items:center;background:#fff;border:1px solid #d8c49a;border-radius:8px;padding:8px 10px;margin-bottom:6px"><a href="${esc(d.data)}" download="${esc(d.name)}" style="text-decoration:none;color:#5a3a22;font-size:13px">📎 ${esc(d.name)}</a><button onclick="albDelDoc('${id}',${i})" style="background:none;border:none;color:#8a1818;cursor:pointer;font-size:15px">✕</button></div>`).join('')||'<div style="color:#9a7a4a">Chưa có tài liệu</div>';
  let html=pdHead('albRoot','📷 Album · '+esc(m.name));
  html+=`<div style="padding:14px 16px 28px">
    <div style="display:flex;gap:8px;margin-bottom:10px">
      <label style="flex:1;text-align:center;background:#8a1818;color:#fff;padding:11px;border-radius:10px;cursor:pointer;font-weight:700">📷 Thêm ảnh<input type="file" accept="image/*" multiple style="display:none" onchange="albAddPhotos('${id}',this.files)"></label>
      <label style="flex:1;text-align:center;background:#c9982f;color:#3a2400;padding:11px;border-radius:10px;cursor:pointer;font-weight:700">📎 Thêm tài liệu<input type="file" multiple style="display:none" onchange="albAddDocs('${id}',this.files)"></label>
    </div>
    <div style="font-size:11px;color:#8a6a4a;margin-bottom:12px">💾 Tổng bộ nhớ: <b>${mb} MB</b>${bytes>3500000?' · sắp đầy, cân nhắc kho ảnh ngoài':''}. Ảnh tự nén còn ~1000px.</div>
    <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px">${imgs}</div>
    <div style="margin-top:16px;font-weight:800;color:#8a1818;margin-bottom:6px">Tài liệu đính kèm</div>${docs}
  </div>`;
  pdOverlay('albRoot',html);

/* ===== Ngày giỗ / cúng các kiểu + Kết nối database ===== */
function lunarToSolar(ld,lm,ly){
  if(!ld||!lm||!ly)return null;
  const end=new Date(ly+1,2,31);
  for(let d=new Date(ly,0,1); d<=end; d.setDate(d.getDate()+1)){
    const l=convertSolar2Lunar(d.getDate(),d.getMonth()+1,d.getFullYear(),TZ);
    if(l[0]===ld&&l[1]===lm&&l[2]===ly)return new Date(d);
  }
  return null;
}
function nextGioDate(m){
  const base=new Date();base.setHours(0,0,0,0);
  if(!m.gioDay||!m.gioMonth)return null;
  if(m.gioType==='duong'){for(let y=0;y<2;y++){const d=new Date(base.getFullYear()+y,m.gioMonth-1,m.gioDay);if(d>=base)return d;}return null;}
  for(let i=0;i<420;i++){const d=new Date(base);d.setDate(base.getDate()+i);const l=convertSolar2Lunar(d.getDate(),d.getMonth()+1,d.getFullYear(),TZ);if(l[0]===m.gioDay&&l[1]===m.gioMonth)return new Date(d);}
  return null;
}
function _deathSolar(m){
  if(!m.deathYear||!m.gioDay||!m.gioMonth)return null;
  if(m.gioType==='duong')return new Date(+m.deathYear,m.gioMonth-1,m.gioDay);
  return lunarToSolar(m.gioDay,m.gioMonth,+m.deathYear);
}
function _gioInYear(m,year){
  if(!m.gioDay||!m.gioMonth)return null;
  if(m.gioType==='duong')return new Date(year,m.gioMonth-1,m.gioDay);
  return lunarToSolar(m.gioDay,m.gioMonth,year);
}
function cungSection(m){
  if(!isDeceased(m)||!m.gioDay||!m.gioMonth)return '';
  const today=new Date();today.setHours(0,0,0,0);
  const fmt=d=>d?(d.getDate()+'/'+(d.getMonth()+1)+'/'+d.getFullYear()):'—';
  const tag=d=>{if(!d)return '';const diff=Math.round((d-today)/86400000);if(diff<0)return '<span style="color:#b3a585">· đã qua</span>';if(diff===0)return '<span style="color:#8a1818;font-weight:700">· hôm nay</span>';return '<span style="color:#8a6a4a">· còn '+diff+' ngày</span>';};
  const chinh=nextGioDate(m);
  const tien=chinh?new Date(chinh.getFullYear(),chinh.getMonth(),chinh.getDate()-1):null;
  const death=_deathSolar(m);
  const d49=death?new Date(death.getFullYear(),death.getMonth(),death.getDate()+49):null;
  const d100=death?new Date(death.getFullYear(),death.getMonth(),death.getDate()+100):null;
  const gioDau=m.deathYear?_gioInYear(m,+m.deathYear+1):null;
  const gioHet=m.deathYear?_gioInYear(m,+m.deathYear+2):null;
  const row=(label,sub,d)=>d?`<div style="display:flex;justify-content:space-between;align-items:baseline;gap:8px;padding:7px 0;border-bottom:1px solid #eadfc6">
     <div><b style="color:var(--maroon)">${label}</b>${sub?` <span style="font-size:11px;color:#9a7a4a">${sub}</span>`:''}</div>
     <div style="font-size:13px;text-align:right;white-space:nowrap">${fmt(d)} ${tag(d)}</div></div>`:'';
  const rows=[
    row('Cúng tiên thường','tối hôm trước',tien),
    row('Chính kỵ (ngày giỗ)','hằng năm',chinh),
    row('Cúng 49 ngày','Chung thất',d49),
    row('Cúng 100 ngày','Tốt khốc',d100),
    row('Giỗ đầu','Tiểu tường',gioDau),
    row('Giỗ hết','Đại tường',gioHet),
  ].join('');
  if(!rows.trim())return '';
  return `<div class="prof-sec"><h3>🕯️ Các ngày cúng</h3>${rows}
    <div style="font-size:11px;color:#9a7a4a;margin-top:7px">Ngày dương lịch, tự tính từ ngày giỗ ${m.gioType==='duong'?'(dương lịch)':'(âm lịch)'}. Mốc 49/100 ngày & giỗ đầu/hết tính từ năm mất.</div></div>`;
}

/* ===== Dọn người trùng (do nhập gia phả nhiều lần) ===== */
function findDupes(){
  const sig=m=>noTone((m.name||'').trim().toLowerCase())+'|'+(m.birthYear||'')+'|'+(m.deathYear||'')+'|'+(m.gioDay||'')+'/'+(m.gioMonth||'');
  const by={};members.forEach(m=>{if(!m.name)return;const s=sig(m);(by[s]=by[s]||[]).push(m);});
  return Object.values(by).filter(g=>g.length>1);
}
function openDupeTool(){
  const groups=findDupes();
  let html=pdHead('dupeRoot','🧹 Dọn người trùng');
  if(!groups.length){html+='<div style="padding:34px;text-align:center;color:#2f6b3a;font-weight:600">✅ Không tìm thấy người trùng.<br>Dữ liệu sạch!</div>';pdOverlay('dupeRoot',html);return;}
  const extra=groups.reduce((s,g)=>s+g.length-1,0);
  html+=`<div style="padding:10px 14px 4px;color:#8a3a1a;font-size:13px">Tìm thấy <b>${groups.length}</b> nhóm trùng (<b>${extra}</b> bản ghi thừa). Khi gộp, app giữ lại 1 người và tự chuyển con cháu / vợ-chồng về người đó.</div>
  <div style="padding:8px 14px"><button onclick="mergeAllDupes()" style="width:100%;padding:13px;border:none;border-radius:10px;background:#8a1818;color:#fff;font-weight:700;font-size:15px;cursor:pointer">⚡ Gộp tất cả (${groups.length} nhóm)</button></div>
  <div style="padding:2px 14px 28px">`;
  groups.forEach((g,i)=>{const m0=g[0];const yrs=[m0.birthYear,m0.deathYear].filter(Boolean).join('–');
    html+=`<div style="margin-top:12px;border:1px solid #e6d6b2;border-radius:12px;padding:11px 13px;background:#fff">
      <div style="font-weight:700;color:#8a1818">${esc(m0.name)} <span style="font-weight:500;color:#8a6a4a;font-size:12px">${yrs?'· '+yrs:''}${m0.gioDay?' · giỗ '+m0.gioDay+'/'+m0.gioMonth:''}</span></div>
      <div style="font-size:12px;color:#7a5a3a;margin:4px 0 9px"><b>${g.length}</b> bản ghi trùng · đời ${[...new Set(g.map(x=>x.gen||genOf(x)))].join(', ')}${m0.branch?' · '+esc(m0.branch):''}</div>
      <button onclick="mergeOneDupe(${i})" style="padding:8px 14px;border:1px solid #c9982f;border-radius:9px;background:#f6ead9;font-weight:600;color:#5a3a22;cursor:pointer">Gộp lại còn 1</button>
    </div>`;});
  html+='</div>';
  window.__dupeGroups=groups;
  pdOverlay('dupeRoot',html);
}
function mergeOneDupe(i){const g=(window.__dupeGroups||[])[i];if(!g)return;_doMerge([g]);openDupeTool();}
function mergeAllDupes(){const g=window.__dupeGroups||findDupes();_doMerge(g);openDupeTool();}
function _doMerge(groups){
  if(typeof snapshot==='function')snapshot();
  groups.forEach(g=>{const keep=g[0].id;const rm=new Set(g.slice(1).map(x=>x.id));
    members.forEach(m=>{if(m.parentId&&rm.has(m.parentId))m.parentId=keep;if(m.spouseId&&rm.has(m.spouseId))m.spouseId=keep;});
    members=members.filter(m=>!rm.has(m.id));});
  try{Store.set('members',members);}catch(e){}
  if(typeof clearGenCache==='function')clearGenCache();
  render();toast('Đã gộp người trùng');
}




/* ===== Sao lưu tự động: chụp khi mở app, giữ 5 bản gần nhất ===== */
function _readSnaps(){try{const a=JSON.parse(localStorage.getItem('gps_snaps'));return Array.isArray(a)?a:[];}catch(e){return [];}}
function _writeSnaps(arr){
  try{localStorage.setItem('gps_snaps',JSON.stringify(arr));return true;}catch(e){}
  // hết dung lượng: bỏ ảnh trong từng bản rồi thử lại
  try{const slim=arr.map(s=>({ts:s.ts,events:s.events,phaky:s.phaky,slim:true,members:(s.members||[]).map(m=>{const c=Object.assign({},m);delete c.avatar;delete c.photos;delete c.docs;return c;})}));
    localStorage.setItem('gps_snaps',JSON.stringify(slim));return true;}catch(e2){return false;}
}
function pushSnap(){
  if(window.__READONLY__||!members.length)return;
  const arr=_readSnaps();
  const last=arr[arr.length-1];
  // bỏ qua nếu vừa chụp dưới 60 giây (tránh trùng khi tải lại nhanh)
  if(last&&(Date.now()-last.ts)<60000)return;
  arr.push({ts:Date.now(),members,events,phaky:(typeof phaky!=='undefined'?phaky:{})});
  while(arr.length>5)arr.shift();
  _writeSnaps(arr);
}
function autoSnapInfo(){const a=_readSnaps();return a.length?a[a.length-1]:null;}
function openRestoreSnaps(){
  const arr=_readSnaps().slice().reverse();

      <button onclick="restoreSnap(${realIdx})" style="padding:7px 13px;border:none;border-radius:9px;background:#8a1818;color:#fff;font-size:12.5px;cursor:pointer;white-space:nowrap">Phục hồi</button></div>`;});

async function restoreSnap(idx){

/* ===== GEDCOM (chuẩn phả hệ) — xuất & nhập ===== */
function _gedFamilies(){
  const byId={};members.forEach(m=>byId[m.id]=m);
  const fams=[];const k2i={};
  const ck=(a,bb)=>[a,bb].filter(Boolean).sort().join('|');
  const seen=new Set();
  members.forEach(m=>{const s=m.spouseId;if(s&&byId[s]){const k=ck(m.id,s);if(!seen.has(k)){seen.add(k);k2i[k]=fams.length;const f={husb:null,wife:null,chil:[]};const setHW=p=>{if(p.gender==='Nữ'){if(!f.wife)f.wife=p.id;else if(!f.husb)f.husb=p.id;}else{if(!f.husb)f.husb=p.id;else if(!f.wife)f.wife=p.id;}};setHW(m);setHW(byId[s]);fams.push(f);}}});
  members.forEach(c=>{const p=c.parentId&&byId[c.parentId];if(!p)return;let k;if(p.spouseId&&byId[p.spouseId])k=ck(p.id,p.spouseId);else k='S|'+p.id;
    if(!(k in k2i)){k2i[k]=fams.length;const f={husb:null,wife:null,chil:[]};if(p.gender==='Nữ')f.wife=p.id;else f.husb=p.id;fams.push(f);}
    fams[k2i[k]].chil.push(c.id);});
  return fams;
}
function exportGedcom(){
  if(!members.length){toast('Chưa có dữ liệu để xuất');return;}
  const idmap={};members.forEach((m,i)=>idmap[m.id]='I'+(i+1));
  const fams=_gedFamilies();const famId=fams.map((_,i)=>'F'+(i+1));
  const famsOf={},famcOf={};
  fams.forEach((f,i)=>{if(f.husb)(famsOf[f.husb]=famsOf[f.husb]||[]).push(famId[i]);if(f.wife)(famsOf[f.wife]=famsOf[f.wife]||[]).push(famId[i]);f.chil.forEach(c=>famcOf[c]=famId[i]);});
  const clean=s=>(s||'').replace(/\r?\n/g,' ');
  let g='0 HEAD\n1 SOUR GiaPhaSo\n2 NAME Gia Pha So\n1 GEDC\n2 VERS 5.5.1\n2 FORM LINEAGE-LINKED\n1 CHAR UTF-8\n1 LANG Vietnamese\n';
  members.forEach(m=>{
    g+='0 @'+idmap[m.id]+'@ INDI\n';
    g+='1 NAME '+clean(m.name)+'\n';
    if(m.gender)g+='1 SEX '+(m.gender==='Nam'?'M':(m.gender==='Nữ'?'F':'U'))+'\n';
    if(m.birthYear){g+='1 BIRT\n2 DATE '+m.birthYear+'\n';}
    if(m.deathYear){g+='1 DEAT\n2 DATE '+m.deathYear+'\n';}
    if(m.occupation)g+='1 OCCU '+clean(m.occupation)+'\n';
    if(m.hometown)g+='1 RESI\n2 PLAC '+clean(m.hometown)+'\n';
    const extra=[];
    if(m.branch)extra.push('Nhánh/Phái: '+m.branch);
    if(m.gioDay)extra.push('Ngày giỗ: '+m.gioDay+'/'+m.gioMonth+(m.gioType==='duong'?' (DL)':' (ÂL)'));
    if(m.grave)extra.push('Mộ phần: '+m.grave);
    if(m.phone)extra.push('Điện thoại: '+m.phone);
    if(m.address)extra.push('Địa chỉ: '+m.address);
    const note=[(m.notes||'').trim(),extra.join(' · ')].filter(Boolean).join('\n');
    if(note){const ls=note.split(/\r?\n/);g+='1 NOTE '+ls[0]+'\n';for(let i=1;i<ls.length;i++)g+='2 CONT '+ls[i]+'\n';}
    (famsOf[m.id]||[]).forEach(fid=>g+='1 FAMS @'+fid+'@\n');
    if(famcOf[m.id])g+='1 FAMC @'+famcOf[m.id]+'@\n';
  });
  fams.forEach((f,i)=>{g+='0 @'+famId[i]+'@ FAM\n';if(f.husb)g+='1 HUSB @'+idmap[f.husb]+'@\n';if(f.wife)g+='1 WIFE @'+idmap[f.wife]+'@\n';f.chil.forEach(c=>g+='1 CHIL @'+idmap[c]+'@\n');});
  g+='0 TRLR\n';
  const blob=new Blob([g],{type:'text/plain;charset=utf-8'});const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);a.download='gia-pha.ged';document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),1500);
  toast('Đã xuất file GEDCOM (.ged) — mở được bằng mọi phần mềm phả hệ');
}
function importGedcom(text){
  const lines=String(text).split(/\r?\n/);
  const indi={},fam={};let cur=null,curType=null,sub=null;
  lines.forEach(raw=>{
    const line=raw.replace(/^\uFEFF/,'').replace(/\s+$/,'');if(!line)return;
    const mlv=line.match(/^(\d+)\s+(.*)$/);if(!mlv)return;
    const level=+mlv[1];const rest=mlv[2];
    if(level===0){sub=null;const mp=rest.match(/^@([^@]+)@\s+(\w+)/);
      if(mp&&mp[2]==='INDI'){cur=mp[1];curType='INDI';indi[cur]={id:cur,name:'',gender:'',birthYear:'',deathYear:'',occupation:'',hometown:'',notes:''};}
      else if(mp&&mp[2]==='FAM'){cur=mp[1];curType='FAM';fam[cur]={husb:'',wife:'',chil:[]};}
      else{cur=null;curType=null;}return;}
    if(!cur)return;
    const sp=rest.indexOf(' ');const tag=sp<0?rest:rest.slice(0,sp);const val=(sp<0?'':rest.slice(sp+1)).trim();
    if(curType==='INDI'){const o=indi[cur];
      if(level===1){sub=tag;
        if(tag==='NAME')o.name=(val.replace(/\//g,' ').replace(/\s+/g,' ')).trim();
        else if(tag==='SEX')o.gender=val==='M'?'Nam':(val==='F'?'Nữ':'');
        else if(tag==='OCCU')o.occupation=val;
        else if(tag==='NOTE')o.notes=val;}
      else if(level>=2){
        if(tag==='DATE'){const y=(val.match(/\d{4}/)||[''])[0];if(sub==='BIRT')o.birthYear=y;else if(sub==='DEAT')o.deathYear=y;}
        else if(tag==='PLAC'&&sub==='RESI'&&!o.hometown)o.hometown=val;
        else if(tag==='CONT'||tag==='CONC')o.notes=(o.notes||'')+(tag==='CONT'?'\n':'')+val;}
    } else if(curType==='FAM'){const f=fam[cur];const ref=(val.match(/@([^@]+)@/)||[])[1];
      if(tag==='HUSB')f.husb=ref;else if(tag==='WIFE')f.wife=ref;else if(tag==='CHIL'&&ref)f.chil.push(ref);}
  });
  const newId={};const out=[];let n=0;const stamp=Date.now().toString(36);
  Object.values(indi).forEach(o=>{const id='g'+stamp+(n++);newId[o.id]=id;
    out.push({id,name:o.name||'(không tên)',gender:o.gender||'',birthYear:o.birthYear||'',deathYear:o.deathYear||'',parentId:'',spouseId:'',branch:'',occupation:o.occupation||'',hometown:o.hometown||'',address:'',phone:'',grave:'',gioDay:'',gioMonth:'',gioType:'am',notes:(o.notes||'').trim(),photos:[],docs:[],updatedAt:Date.now()});});
  const byNew={};out.forEach(m=>byNew[m.id]=m);
  Object.values(fam).forEach(f=>{const h=newId[f.husb],w=newId[f.wife];
    if(h&&w){if(byNew[h])byNew[h].spouseId=w;if(byNew[w])byNew[w].spouseId=h;}
    const par=h||w;if(par)f.chil.forEach(cid=>{const c=newId[cid];if(c&&byNew[c])byNew[c].parentId=par;});});
  return out;
}
function pickGedcom(){
  if(typeof needAuth==='function'&&needAuth())return;
  const inp=document.createElement('input');inp.type='file';inp.accept='.ged,.gedcom,text/plain';
  inp.onchange=function(){const f=inp.files&&inp.files[0];if(!f)return;const r=new FileReader();
    r.onload=function(e){let imp;try{imp=importGedcom(e.target.result);}catch(err){toast('File GEDCOM không đọc được');return;}
      if(!imp.length){toast('Không tìm thấy người nào trong file');return;}
      if(!confirm('Tìm thấy '+imp.length+' người trong file GEDCOM.\n\nNhập sẽ THAY THẾ dữ liệu hiện tại bằng dữ liệu trong file. Bản an toàn tự động vẫn được giữ (có thể Hoàn tác).\n\nTiếp tục?'))return;
      if(typeof snapshot==='function')snapshot();
      members=imp;Store.set('members',members);
      if(typeof clearGenCache==='function')clearGenCache();
      try{closePdOverlay('toolsRoot');}catch(e){}
      render();toast('Đã nhập '+imp.length+' người từ GEDCOM');};
    r.readAsText(f,'utf-8');};
  inp.click();
}


/* ===== Giỗ âm lịch -> ngày dương lịch năm nay (tự cập nhật theo năm) ===== */
let _gioSolarCache={};
function gioSolarThisYear(m){
  if(!m||!m.gioDay||!m.gioMonth)return null;
  const yr=new Date().getFullYear();
  if(m.gioType==='duong'){try{return new Date(yr,m.gioMonth-1,m.gioDay);}catch(e){return null;}}
  const key=m.gioDay+'_'+m.gioMonth+'_'+yr;
  if(key in _gioSolarCache)return _gioSolarCache[key]?new Date(_gioSolarCache[key]):null;
  let found=null;
  for(let i=0;i<366;i++){const d=new Date(yr,0,1+i);const l=convertSolar2Lunar(d.getDate(),d.getMonth()+1,d.getFullYear(),TZ);if(l[0]===m.gioDay&&l[1]===m.gioMonth&&!l[3]){found=d;break;}}
  if(!found){for(let i=0;i<366;i++){const d=new Date(yr,0,1+i);const l=convertSolar2Lunar(d.getDate(),d.getMonth()+1,d.getFullYear(),TZ);if(l[0]===m.gioDay&&l[1]===m.gioMonth){found=d;break;}}}
  _gioSolarCache[key]=found?found.getTime():0;
  return found;
}
function fmtViDate(d){const wd=['Chủ nhật','Thứ Hai','Thứ Ba','Thứ Tư','Thứ Năm','Thứ Sáu','Thứ Bảy'][d.getDay()];return wd+', '+d.getDate()+'/'+(d.getMonth()+1)+'/'+d.getFullYear();}


/* ===== Phả đồ -> PDF tải về (không cần mạng, không dùng window.print) ===== */
function _b64ToBytes(b64){const bin=atob(b64);const len=bin.length;const u=new Uint8Array(len);for(let i=0;i<len;i++)u[i]=bin.charCodeAt(i);return u;}
function _imgsToPdfBlob(imgs){
  const chunks=[];let offset=0;const objOffset={};
  const enc=(s)=>new TextEncoder().encode(s);
  const push=(u8)=>{chunks.push(u8);offset+=u8.length;};
  const pushStr=(s)=>push(enc(s));
  const N=imgs.length;const totalObjs=2+N*3;
  pushStr('%PDF-1.4\n');
  push(new Uint8Array([0x25,0xE2,0xE3,0xCF,0xD3,0x0A])); // binary marker
  const writeObj=(num,head,streamBytes)=>{
    objOffset[num]=offset;
    pushStr(num+' 0 obj\n'+head);
    if(streamBytes){pushStr('\nstream\n');push(streamBytes);pushStr('\nendstream');}
    pushStr('\nendobj\n');
  };
  writeObj(1,'<< /Type /Catalog /Pages 2 0 R >>');
  const kids=[];for(let i=0;i<N;i++)kids.push((3+i*3)+' 0 R');
  writeObj(2,'<< /Type /Pages /Kids ['+kids.join(' ')+'] /Count '+N+' >>');
  for(let i=0;i<N;i++){
    const im=imgs[i];const pageNum=3+i*3,contentNum=4+i*3,imgNum=5+i*3;
    const Wp=800,Hp=Math.max(1,Math.round(800*im.h/im.w));
    const content='q '+Wp+' 0 0 '+Hp+' 0 0 cm /Im0 Do Q';
    const cb=enc(content);
    writeObj(pageNum,'<< /Type /Page /Parent 2 0 R /MediaBox [0 0 '+Wp+' '+Hp+'] /Resources << /XObject << /Im0 '+imgNum+' 0 R >> >> /Contents '+contentNum+' 0 R >>');
    writeObj(contentNum,'<< /Length '+cb.length+' >>',cb);
    writeObj(imgNum,'<< /Type /XObject /Subtype /Image /Width '+im.w+' /Height '+im.h+' /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length '+im.bytes.length+' >>',im.bytes);
  }
  const xrefOffset=offset;
  let xref='xref\n0 '+(totalObjs+1)+'\n0000000000 65535 f \n';
  for(let n=1;n<=totalObjs;n++){xref+=String(objOffset[n]||0).padStart(10,'0')+' 00000 n \n';}
  pushStr(xref);
  pushStr('trailer\n<< /Size '+(totalObjs+1)+' /Root 1 0 R >>\nstartxref\n'+xrefOffset+'\n%%EOF');
  return new Blob(chunks,{type:'application/pdf'});
}
function _phaDoPagesToPDF(pages,label){
  if(!pages.length){toast('Chưa có dữ liệu phả đồ');return;}
  toast('Đang tạo PDF…');
  const imgs=[];let i=0;
  const finish=function(){
    if(!imgs.length){toast('Không tạo được PDF (nhánh quá lớn, thử Tải PNG/SVG)');return;}
    let blob;try{blob=_imgsToPdfBlob(imgs);}catch(e){toast('Lỗi tạo PDF');return;}
    const url=URL.createObjectURL(blob);
    const name='pha-do-'+((label||'').replace(/[^0-9A-Za-zÀ-ỹ]+/g,'-')||'gia-pha')+'.pdf';
    const a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();
    setTimeout(function(){URL.revokeObjectURL(url);},60000);
    toast('Đã tạo PDF ('+imgs.length+' trang) — xem mục Tải về của trình duyệt');
  };
  const step=function(){
    if(i>=pages.length){finish();return;}
    const pg=pages[i++];const mx=Math.max(pg.w,pg.h)||1180;
    svgToCanvas(pg.svg,pg.w,pg.h,Math.min(2,3200/mx)).then(function(cv){
      try{const b64=cv.toDataURL('image/jpeg',0.85).split(',')[1];if(b64)imgs.push({bytes:_b64ToBytes(b64),w:cv.width,h:cv.height});}catch(e){}
      step();
    }).catch(function(){step();});
  };
  step();
}


/* ===== Danh sách sinh nhật ===== */
function openBirthdayList(){
  const list=members.filter(m=>m.birthDay&&m.birthMonth);
  if(!list.length){pdOverlay('bdayRoot',pdHead('bdayRoot','🎂 Danh sách sinh nhật')+'<div style="padding:26px;text-align:center;color:#8a6a4a;line-height:1.6">Chưa có ai được nhập <b>ngày/tháng sinh</b>.<br>Vào ✏️ Sửa từng người, điền <b>Ngày sinh</b>, rồi danh sách sẽ hiện ở đây.</div>');return;}
  const today=new Date();const ty=today.getFullYear();
  const t0=new Date(ty,today.getMonth(),today.getDate());t0.setHours(0,0,0,0);
  const rows=list.map(m=>{
    let nd=new Date(ty,m.birthMonth-1,m.birthDay);nd.setHours(0,0,0,0);
    if(nd<t0)nd=new Date(ty+1,m.birthMonth-1,m.birthDay);
    const days=Math.round((nd-t0)/86400000);
    return {m,days};
  }).sort((a,b)=>a.days-b.days).map(({m,days})=>{
    const alive=!m.deathYear;
    const age=(alive&&m.birthYear)?(' · '+(ty-(+m.birthYear))+' tuổi'):(m.deathYear?' · đã mất':'');
    const when=days===0?'<b style="color:#b01818">Hôm nay 🎉</b>':(days===1?'Ngày mai':('còn '+days+' ngày'));
    const av=m.avatar?'<img src="'+esc(m.avatar)+'" style="width:38px;height:38px;border-radius:50%;object-fit:cover">':'<div style="width:38px;height:38px;border-radius:50%;background:#f6ead9;display:flex;align-items:center;justify-content:center;font-size:18px">'+(m.gender==='Nữ'?'👩':'👨')+'</div>';
    return '<div onclick="closePdOverlay(\'bdayRoot\');openMemberDetail(\''+m.id+'\')" style="display:flex;gap:10px;align-items:center;padding:9px 12px;border-bottom:1px solid #f0e6cf;cursor:pointer">'+av+
      '<div style="flex:1"><div style="font-weight:600;color:#7a0f0f">'+esc(m.name)+'</div>'+
      '<div style="font-size:12px;color:#8a6a4a">🎂 '+m.birthDay+'/'+m.birthMonth+(m.birthYear?'/'+m.birthYear:'')+' · đời '+(m.gen||genOf(m))+age+'</div></div>'+
      '<div style="font-size:12px;color:#8a6a4a;white-space:nowrap;text-align:right">'+when+'</div></div>';
  }).join('');
  pdOverlay('bdayRoot',pdHead('bdayRoot','🎂 Sinh nhật ('+list.length+' người)')+'<div style="font-size:12px;color:#8a6a4a;padding:8px 12px">Xếp theo sinh nhật gần nhất. Bấm vào một người để xem hồ sơ.</div>'+rows);
}
/* ===== Đường về tổ tiên ===== */
function traceAncestors(id){
  const chain=[];let cur=members.find(x=>x.id===id);let guard=0;
  while(cur&&guard<80){chain.push(cur);cur=cur.parentId?members.find(x=>x.id===cur.parentId):null;guard++;}
  if(!chain.length)return;
  const top=chain.slice().reverse();
  const items=top.map((m,i)=>{
    const isMe=m.id===id;
    const av=m.avatar?'<img src="'+esc(m.avatar)+'" style="width:36px;height:36px;border-radius:50%;object-fit:cover">':'<div style="width:36px;height:36px;border-radius:50%;background:#f6ead9;display:flex;align-items:center;justify-content:center;font-size:17px">'+(m.gender==='Nữ'?'👩':'👨')+'</div>';
    return '<div onclick="closePdOverlay(\'ancRoot\');openMemberDetail(\''+m.id+'\')" style="display:flex;gap:10px;align-items:center;padding:8px 12px;cursor:pointer;'+(isMe?'background:#fff5f5;border:1px solid #f0c9c9;border-radius:10px':'')+'">'+av+
      '<div style="flex:1"><div style="font-weight:'+(isMe?'700':'600')+';color:#7a0f0f">'+esc(m.name)+(isMe?' 👈 người này':'')+'</div>'+
      '<div style="font-size:12px;color:#8a6a4a">đời '+(m.gen||genOf(m))+(m.branch?' · '+esc(m.branch):'')+'</div></div></div>'+
      (i<top.length-1?'<div style="text-align:center;color:#b9892a;font-size:16px;line-height:1">↓</div>':'');
  }).join('');
  const me=members.find(x=>x.id===id);
  pdOverlay('ancRoot',pdHead('ancRoot','🧭 Đường về tổ tiên')+'<div style="font-size:12px;color:#8a6a4a;padding:8px 12px">Từ tổ trên cùng xuống tới <b>'+esc(me?me.name:'')+'</b> — tất cả '+chain.length+' đời.</div>'+items);
}
