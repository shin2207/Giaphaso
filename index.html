<!doctype html>
<html lang="vi">
<head>

<style>
:root{
  --maroon:#8a1818; --maroon-d:#6f1212; --maroon-l:#a83030;
  --gold:#c9981f; --gold-l:#e0b53f; --gold-soft:#f3e6c4;
  --cream:#fbf2e9; --cream-2:#f6ead9;
  --card:#ffffff; --line:#efe1c9;
  --ink:#5a3a22; --ink-soft:#8a6a4a; --muted:#b89a6f;
  --shadow:0 6px 20px rgba(110,40,20,.08);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  background:var(--cream);color:var(--ink);padding-bottom:78px;
  background-image:repeating-linear-gradient(0deg,transparent,transparent 28px,rgba(201,152,31,.04) 29px);}
h1,h2,h3{margin:0}
button{font-family:inherit;cursor:pointer;border:none}
input,select,textarea{font-family:inherit;font-size:15px}

header{position:sticky;top:0;z-index:30;background:linear-gradient(180deg,var(--maroon-l),var(--maroon));
  color:#fff;padding:14px 18px;display:flex;align-items:center;gap:12px;box-shadow:0 4px 14px rgba(80,20,10,.25)}
.logo{width:44px;height:44px;border-radius:50%;flex:none;
  background:radial-gradient(circle at 35% 30%,var(--gold-l),var(--gold));
  display:flex;align-items:center;justify-content:center;font-size:24px}
.brand h1{font-size:20px;letter-spacing:.3px}
.brand p{margin:1px 0 0;font-size:12px;opacity:.85;font-style:italic}
.add-btn{margin-left:auto;background:linear-gradient(180deg,var(--gold-l),var(--gold));color:#5a3a08;
  font-weight:700;padding:10px 16px;border-radius:24px;font-size:14px;box-shadow:0 3px 8px rgba(0,0,0,.18);white-space:nowrap}
.add-btn:active{transform:translateY(1px)}

main{max-width:980px;margin:0 auto;padding:18px 16px 8px}
.section-title{display:flex;align-items:center;gap:14px;margin:6px 2px 14px;color:var(--maroon);font-size:19px;font-weight:800}
.section-title::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--gold),transparent)}

.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:14px}
.stat{background:var(--card);border:1px solid var(--gold-soft);border-radius:16px;padding:18px 8px;text-align:center;box-shadow:var(--shadow)}
.stat .num{font-size:30px;font-weight:800;color:var(--maroon)}
.stat .lbl{font-size:13px;color:var(--ink-soft);margin-top:2px}

.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.pill{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:9px 16px;font-weight:700;
  font-size:14px;color:var(--maroon);box-shadow:var(--shadow);display:flex;align-items:center;gap:7px}
.pill:active{transform:translateY(1px)}

.empty{text-align:center;color:var(--ink-soft);padding:48px 16px}
.empty .ico{font-size:46px}
.empty .big{color:var(--maroon);font-size:17px;margin-top:8px}

.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;box-shadow:var(--shadow)}

/* family tree */
ul.tree-root,.tree-root ul{list-style:none;margin:0;padding:0}
.tree-root ul{margin-left:16px;padding-left:14px;border-left:2px solid var(--line)}
.tree-root li{position:relative;margin:8px 0}
.tree-root ul>li::before{content:"";position:absolute;left:-14px;top:24px;width:12px;height:2px;background:var(--line)}
.node-row{display:flex;gap:10px;align-items:center;background:var(--card);border:1px solid var(--line);
  border-left:4px solid var(--gold);border-radius:12px;padding:8px 10px;box-shadow:var(--shadow)}
.node-row.deceased{border-left-color:var(--ink-soft)}
.node-row .av{width:38px;height:38px;border-radius:50%;background:var(--cream-2);display:flex;align-items:center;
  justify-content:center;font-size:18px;flex:none;overflow:hidden}
.ninfo{flex:1;min-width:0}
.node-row .nm{font-weight:700;color:var(--maroon);font-size:15px}
.node-row .meta{font-size:12px;color:var(--ink-soft)}
.doi{font-size:10px;color:#8a6708;font-weight:700;background:var(--gold-soft);padding:1px 6px;border-radius:8px;vertical-align:middle;margin-left:4px}
.spouse{margin-left:6px;color:var(--ink-soft)}
.nacts{display:flex;gap:4px;flex:none}
img.av{object-fit:cover;display:block}
.grp{margin-bottom:14px;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--card);box-shadow:var(--shadow)}
.grp-h{display:flex;align-items:center;gap:8px;padding:12px 14px;background:linear-gradient(180deg,#fff,var(--cream-2));cursor:pointer;font-weight:800;color:var(--maroon)}
.grp-h .caret{color:var(--gold);font-size:13px;width:14px}
.grp-t{flex:1}
.grp-n{font-size:12px;font-weight:600;color:var(--ink-soft)}
.grp ul.tree-root{padding:10px 14px 14px}
.caret-btn{background:none;border:none;color:var(--gold);font-size:13px;padding:2px 4px;flex:none;cursor:pointer}
.caret-sp{display:inline-block;width:14px;flex:none}
.kcount{font-size:11px;color:var(--ink-soft);font-weight:600}
.seg{display:flex;gap:6px;margin:0 0 12px;background:var(--cream-2);border:1px solid var(--line);border-radius:12px;padding:4px}
.seg button{flex:1;border:none;background:transparent;padding:8px;border-radius:9px;font-weight:700;color:var(--ink-soft);font-size:13px;cursor:pointer}
.seg button.on{background:var(--maroon);color:#fff;box-shadow:var(--shadow)}
.chart-block{margin-bottom:18px}
.chart-title{font-weight:800;color:var(--maroon);margin:0 2px 8px;font-size:16px}
.chart-scroll{overflow:auto;border:1px solid var(--line);border-radius:14px;background:var(--card);box-shadow:var(--shadow);padding:16px;-webkit-overflow-scrolling:touch}
.chart{display:inline-block;transform-origin:top left;transition:transform .15s}
.orgtree ul{position:relative;padding-top:20px;display:flex;justify-content:center;margin:0;list-style:none}
.orgtree li{display:flex;flex-direction:column;align-items:center;position:relative;padding:20px 6px 0;list-style:none}
.orgtree li::before,.orgtree li::after{content:'';position:absolute;top:0;right:50%;border-top:2px solid var(--gold);width:50%;height:20px}
.orgtree li::after{right:auto;left:50%;border-left:2px solid var(--gold)}
.orgtree li:only-child::after,.orgtree li:only-child::before{display:none}

.orgtree li:first-child::before,.orgtree li:last-child::after{border:0 none}

.orgtree ul ul::before{content:'';position:absolute;top:0;left:50%;border-left:2px solid var(--gold);width:0;height:20px}
.orgtree>ul{padding-top:0}.orgtree>ul>li{padding-top:0}
.obox{display:inline-block;border:2px solid var(--gold);border-radius:9px;background:#fff;padding:6px 10px;min-width:118px;max-width:180px;cursor:pointer;text-align:center;white-space:normal}
.obox.root{background:linear-gradient(180deg,var(--maroon-l),var(--maroon));border-color:var(--maroon-d)}
.obox.dead{border-color:var(--ink-soft)}
.obox .ob-n{font-weight:700;color:var(--maroon);font-size:12.5px;line-height:1.25}
.obox.root .ob-n{color:#fff;font-size:14px}
.obox .ob-s{color:var(--ink-soft);font-size:11px;line-height:1.2}
.obox .ob-d{color:#8a6708;font-size:10px;font-weight:700;margin-top:2px}

.search{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);
  border-radius:28px;padding:12px 18px;box-shadow:var(--shadow)}
.search input{border:none;outline:none;flex:1;background:transparent;color:var(--ink)}
.search .mag{font-size:18px}

.mlist{display:flex;flex-direction:column;gap:10px;margin-top:16px}
.mrow{display:flex;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;box-shadow:var(--shadow)}
.mrow .av{width:44px;height:44px;border-radius:50%;background:var(--cream-2);display:flex;align-items:center;justify-content:center;font-size:20px;flex:none;overflow:hidden}
.mrow .nm{font-weight:700;color:var(--maroon)}
.mrow .meta{font-size:13px;color:var(--ink-soft)}
.mrow .acts{margin-left:auto;display:flex;gap:6px}
.icon-btn{background:var(--cream-2);border-radius:9px;padding:7px 9px;font-size:14px;color:var(--ink)}
.icon-btn.danger{color:#a12020}

.clock{background:linear-gradient(180deg,var(--maroon-l),var(--maroon));color:#fff;border-radius:18px;text-align:center;padding:18px;margin-bottom:16px;box-shadow:var(--shadow)}
.clock .t{font-size:34px;font-weight:800;letter-spacing:1px}
.clock .d{opacity:.85;margin-top:2px}
.clock .lunar{font-size:14px;opacity:.95;margin-top:4px}
.cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.cal-head h2{color:var(--maroon);font-size:18px}
.nav-arrow{background:var(--card);border:1px solid var(--line);border-radius:10px;width:38px;height:38px;font-size:18px;color:var(--maroon)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .dow{text-align:center;font-weight:700;color:var(--gold);font-size:13px;padding:6px 0}
.day{aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:10px;

.day.out{color:var(--muted);opacity:.5}
.day:hover{background:var(--cream-2)}
.day.has::after{content:"";width:6px;height:6px;border-radius:50%;background:var(--maroon);position:absolute;bottom:4px}
.day.sel{outline:2px solid var(--maroon)}
.day .sd{line-height:1.05}
.day .ld{font-size:9.5px;line-height:1;color:var(--muted);margin-top:2px;font-weight:600}
.day.ram .ld{color:#b8860b}.day.ram{background:#fbf3da}
.day.mung1 .ld{color:var(--maroon)}.day.mung1{background:#f8efe2}
.day.fest .ld{color:var(--maroon);font-weight:800}.day.fest{background:#f7e3e3}
.day.gio::after{background:#6f1212}
.day.today{background:var(--gold-soft)!important;border-color:var(--gold)}
.legend{display:flex;flex-wrap:wrap;gap:8px 16px;font-size:12px;color:var(--ink-soft);margin:0 2px 8px;align-items:center}
.legend i.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:middle}
.legend .dot.mung{background:#e9d7bf;border:1px solid var(--maroon)}
.legend .dot.ram{background:#f3e3b0;border:1px solid #b8860b}
.legend .dot.fest{background:#f3d2d2;border:1px solid var(--maroon)}
.legend .dot.gio{background:#6f1212}

.ev-list{display:flex;flex-direction:column;gap:10px;margin-top:8px}
.ev{display:flex;gap:12px;align-items:flex-start;background:var(--card);border:1px solid var(--line);border-left:5px solid var(--gold);border-radius:12px;padding:12px;box-shadow:var(--shadow)}
.ev .when{font-size:13px;color:var(--gold);font-weight:700;min-width:78px}
.ev .ttl{font-weight:700;color:var(--maroon)}
.ev .desc{font-size:13px;color:var(--ink-soft);margin-top:2px}
.ev .acts{margin-left:auto;display:flex;gap:6px;flex:none}
.badge{background:var(--gold-soft);color:#8a6708;font-size:11px;font-weight:700;padding:3px 8px;border-radius:10px}

.clan-banner{background:linear-gradient(135deg,var(--maroon-d),var(--maroon-l));color:#fff;border-radius:18px;padding:18px 20px;margin-bottom:14px;box-shadow:var(--shadow)}
.clan-banner h2{font-size:20px}
.clan-banner p{margin:4px 0 0;opacity:.85;font-size:13px}
.clan-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-top:14px}
.clan{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;box-shadow:var(--shadow);text-align:center;cursor:pointer;transition:transform .12s}
.clan:active{transform:scale(.97)}
.clan .seal{width:48px;height:48px;margin:0 auto 8px;border-radius:50%;background:radial-gradient(circle at 35% 30%,var(--maroon-l),var(--maroon));color:#fff;font-size:22px;font-weight:800;display:flex;align-items:center;justify-content:center}
.clan .cn{font-weight:800;color:var(--maroon);font-size:16px}
.clan .cm{font-size:12px;color:var(--ink-soft);margin-top:2px}
table.tq{width:100%;border-collapse:collapse;font-size:14px}
table.tq th,table.tq td{border:1px solid var(--line);padding:7px 10px;text-align:left}
table.tq th{background:var(--gold-soft);color:var(--maroon)}
table.tq tr:nth-child(even) td{background:#fdf8f0}

.acct-card{max-width:420px;margin:24px auto;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px;box-shadow:var(--shadow)}
.acct-card h2{color:var(--maroon);text-align:center;font-size:20px;margin-bottom:4px}
.acct-card .sub{text-align:center;color:var(--ink-soft);font-size:13px;margin-bottom:18px}
.tabs{display:flex;background:var(--cream-2);border-radius:12px;padding:4px;margin-bottom:18px}
.tabs button{flex:1;padding:9px;border-radius:9px;background:transparent;color:var(--ink-soft);font-weight:700;font-size:14px}
.tabs button.on{background:var(--card);color:var(--maroon);box-shadow:0 2px 6px rgba(0,0,0,.06)}
.profile{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
.profile .big-av{width:78px;height:78px;border-radius:50%;background:radial-gradient(circle at 35% 30%,var(--gold-l),var(--gold));display:flex;align-items:center;justify-content:center;font-size:38px}

label{display:block;font-weight:700;color:var(--ink);font-size:14px;margin:12px 0 5px}
.req{color:var(--maroon)}
input.f,select.f,textarea.f{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:11px;background:var(--cream);color:var(--ink);outline:none}
input.f:focus,select.f:focus,textarea.f:focus{border-color:var(--gold);background:#fff}
textarea.f{min-height:84px;resize:vertical}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.row3{display:grid;grid-template-columns:1fr 1fr 1.2fr;gap:8px}
.primary{width:100%;background:linear-gradient(180deg,var(--maroon-l),var(--maroon));color:#fff;font-weight:800;padding:14px;border-radius:12px;font-size:16px;margin-top:18px}
.primary:active{transform:translateY(1px)}
.ghost{width:100%;background:var(--cream-2);color:var(--ink);font-weight:700;padding:13px;border-radius:12px;font-size:15px;margin-top:10px}
.note{font-size:12px;color:var(--muted);text-align:center;margin-top:14px;line-height:1.5}

.overlay{position:fixed;inset:0;background:rgba(40,15,10,.45);z-index:50;display:flex;align-items:flex-start;justify-content:center;padding:24px 12px;overflow:auto}
.modal{background:#fff;border-radius:18px;width:100%;max-width:520px;padding:22px;box-shadow:0 20px 50px rgba(0,0,0,.3);animation:pop .18s ease}
@keyframes pop{from{transform:translateY(14px);opacity:0}to{transform:none;opacity:1}}
.modal h2{text-align:center;color:#4a2bb0;font-size:21px;margin-bottom:14px}
.pick-av{width:88px;height:88px;border-radius:50%;margin:0 auto 6px;border:3px solid var(--gold);background:var(--cream-2);display:flex;align-items:center;justify-content:center;font-size:40px;color:#4a2bb0;cursor:pointer;overflow:hidden}
.pick-hint{text-align:center;color:var(--ink-soft);font-size:13px;margin-bottom:6px}

nav.tabbar{position:fixed;bottom:0;left:0;right:0;z-index:30;background:#fff;border-top:1px solid var(--line);display:flex;box-shadow:0 -3px 12px rgba(0,0,0,.05)}
nav.tabbar button{flex:1;background:none;padding:9px 2px 8px;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--ink-soft);font-size:11px;font-weight:600}
nav.tabbar button .ti{font-size:21px}
nav.tabbar button.on{color:var(--maroon);font-weight:800}

.fab{position:fixed;right:18px;bottom:88px;z-index:31;width:58px;height:58px;border-radius:50%;background:linear-gradient(180deg,var(--maroon-l),var(--maroon));color:#fff;font-size:30px;box-shadow:0 8px 20px rgba(120,30,15,.4)}
.fab:active{transform:scale(.94)}

@media(max-width:560px){.brand h1{font-size:17px}.brand p{font-size:11px}.add-btn{padding:9px 12px;font-size:13px}.stat .num{font-size:24px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<header>
  <div class="logo">🌳</div>
  <div class="brand"><h1>Gia Phả Số</h1><p>Kết nối tình thân – Giữ gìn nguồn cội</p></div>
  <button class="add-btn" onclick="openMemberForm()">+ Thêm thành viên</button>
</header>

<main id="view"></main>
<button class="fab" onclick="onFab()">+</button>
<nav class="tabbar" id="tabbar"></nav>
<div id="modal-root"></div>

<script>
/* ====== CẤU HÌNH CLOUD (Supabase) — dùng chung cho cả họ ======
   Lấy ở Supabase → Settings → API. Dán vào 2 dòng dưới.
   ĐỂ TRỐNG = app chạy bằng localStorage (dữ liệu riêng từng máy). */
const SUPABASE_URL = "";
const SUPABASE_KEY = "";
/* ============================================================== */
const CLOUD = !!(SUPABASE_URL && SUPABASE_KEY && typeof window!=='undefined' && window.supabase && window.supabase.createClient);
const sb = CLOUD ? window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY) : null;

const SHARED_KEYS=['members','events','accounts','phaky'];
const Store={
  mem:{},
  async get(k,fb){
    if(CLOUD){try{const {data,error}=await sb.from('app_data').select('value').eq('key',k).maybeSingle();
      if(!error)return data?data.value:fb;}catch(e){}}
    const shared=SHARED_KEYS.includes(k);
    try{if(window.storage){const r=await window.storage.get(k,shared);return r?JSON.parse(r.value):fb;}}catch(e){}
    try{const ls=localStorage.getItem('gps_'+k);if(ls!=null)return JSON.parse(ls);}catch(e){}
    return (k in this.mem)?this.mem[k]:fb;},
  async set(k,v){this.mem[k]=v;
    if(CLOUD){try{const {error}=await sb.from('app_data').upsert({key:k,value:v,updated_at:new Date().toISOString()});
      if(error)toast('Lỗi lưu cloud: '+(error.message||''));}catch(e){toast('Lỗi kết nối cloud');}}
    const shared=SHARED_KEYS.includes(k);
    try{if(window.storage){await window.storage.set(k,JSON.stringify(v),shared);}}catch(e){}
    try{localStorage.setItem('gps_'+k,JSON.stringify(v));}catch(e){}}
};

/* ---------- state ---------- */
let members=[],events=[],accounts=[],currentUser=null,pendingImport=null,undoStack=[];
let tab='giapha',calRef=new Date(),calSel=null,memberSearch='',clanSearch='',acctMode='login',formAvatar='',phaky={},phaSearch='';
let collapsedGroups=new Set(),collapsedNodes=new Set(),memberView='phai';

const CLANS=[
  {n:'Nguyễn',pct:'~38%',info:'Họ phổ biến nhất Việt Nam, gắn với triều Nguyễn (1802–1945).'},
  {n:'Trần',pct:'~11%',info:'Gắn với triều Trần, ba lần đánh thắng quân Nguyên Mông.'},
  {n:'Lê',pct:'~9.5%',info:'Triều Lê do Lê Lợi sáng lập sau khởi nghĩa Lam Sơn.'},
  {n:'Phạm',pct:'~7%',info:'Họ lâu đời, phân bố rộng khắp ba miền.'},
  {n:'Hoàng',pct:'~5%',info:'Miền Nam thường viết là Huỳnh do kiêng huý.'},
  {n:'Huỳnh',pct:'~5%',info:'Biến thể của họ Hoàng, phổ biến ở miền Nam.'},
  {n:'Phan',pct:'~4%',info:'Nhiều danh nhân: Phan Bội Châu, Phan Châu Trinh.'},
  {n:'Vũ',pct:'~3.9%',info:'Gốc làng Mộ Trạch (Hải Dương) – "lò tiến sĩ".'},
  {n:'Võ',pct:'~3.9%',info:'Biến thể của họ Vũ, phổ biến ở miền Trung – Nam.'},
  {n:'Đặng',pct:'~2.1%',info:'Họ có truyền thống khoa bảng và võ tướng.'},
  {n:'Bùi',pct:'~2%',info:'Phân bố nhiều ở đồng bằng Bắc Bộ.'},

  tua:`Nhân nay đất nước thanh bình an lạc, để chuẩn bị cho Lễ Hội tổ 5 năm lần thứ 6 (1995–2025), chúng tôi tập trung huy động các chi phái trong tộc cung cấp thông tin các hệ đời để thiết lập bảng tông đồ dòng tộc và quyển tộc phả từ đời thứ 11 đến đời 17 để lại cho con cháu mai sau làm cơ sở; hằng năm vào ngày giỗ chạp tiếp tục ghi chép các đời con cháu sinh sau.

Nước có quốc sử, nhà có gia phả. Để biết tổ tiên ta từ đâu mà đến, thứ tự Phái – Chi – Nhánh, lớp lang để xưng hô cho đúng đạo lý, phải biết tôn trọng giữ gìn những gì ông cha để lại, giữ gìn bản sắc văn hóa dân tộc, thuần phong mỹ tục; cốt lõi là phải duy trì cái tâm, cái đức hạnh con người, luôn nhớ về tiên tổ cội nguồn — đó là điều nhắc nhở đạo hiếu. Hằng năm vào dịp giỗ chạp, lễ tết, con cháu phải đoàn kết một lòng, trên thuận dưới hòa, tập trung tổ chức các nghi thức cúng bái, thể hiện cái tâm, cái đức, không cần rình rang linh đình.

  hinhThanh:`Theo dòng lịch sử và các ghi chép của tộc họ Nguyễn trong nước, dòng họ Nguyễn khởi nguồn từ quận Trần Lưu, tỉnh Hà Đông, năm (924–979) quá nhập Nam Thiên.

Ngài tổ dòng họ ta cách đây mấy ngàn năm ở ngoài Bắc đi vào xứ Thanh Hóa, tỉnh Thanh Hóa, khai cơ lập nghiệp, kiến canh ruộng đất được hơn 700 mẫu. Do phân chia ruộng đất không đều nên người con thứ là Nguyễn Phước Thức, vào năm Cảnh Long thứ 2, ngày 15 tháng 5, đi vào Quảng Trị, tỉnh (phủ) Hải Lăng, huyện Phú Lộc lập xã. Tại đây ngài Nguyễn Phước Thức đã sinh hạ được 5 trai 4 gái và đổi thành Nguyễn Như. Ở Quảng Trị ngài đã khai canh ruộng đất được hơn 600 mẫu, sinh ra các ngài: Nguyễn Như Thăng, Nguyễn Như Chức, Nguyễn Như Chương, Nguyễn Như Thuyên, Nguyễn Như Hoành và Nguyễn Như Thị Sự.

Tháng tư nhuận năm Kỷ Tỵ (Vĩnh Dụ thứ 12), phụng chỉ dụ vào Nam. Năm Cảnh Hưng thứ nhất, ngày 15 tháng 5 năm 1740, ngài tổ để ngài Nguyễn Như Thuyên cùng các nàng dâu ở lại Quảng Trị canh tác ruộng đất, nuôi dưỡng cha mẹ; còn ngài Nguyễn Như Thăng và con trai là Nguyễn Như Đệ, cùng em là Nguyễn Như Chức với 4 con trai của ngài Như Chức — Như Triều (tức Công Tuấn), Như Hữu (tức Đình Nhơn), Như Hùng (tức Như Tác), Như Hạnh (tức Văn Xá) — đi thuyền từ Quảng Trị vào Quảng Nam, huyện Diên Khánh (nay là Điện Bàn). Ngài Nguyễn Như Thăng khai khẩn ruộng đất được hơn 600 mẫu, lập xã hiệu Câu Nhí cùng các tộc khác trong làng.

Sau năm 1975, khi đất nước thanh bình, cuộc sống ổn định, qua thời gian đi tìm lại cội nguồn và thông tin từ dòng họ Nguyễn Quảng Nam – Đà Nẵng: ngài Nguyễn Như Chương vào khai canh lập nghiệp tại làng Châu Lâu, xã Điện Thọ, lập nhà thờ tộc; còn con ngài Nguyễn Như Chức là Nguyễn Như Đơn vào khai cơ lập nghiệp tại làng Trà Kiệu, huyện Duy Xuyên (tiền hiền tại Trà Kiệu).

Vào những năm 2011–2017, tộc ta cùng Nguyễn Như Bằng An và Nguyễn Như Châu Lâu tổ chức hành hương đi tìm cội nguồn và đã tìm được tộc Nguyễn Như ở làng Câu Nhí, xã Hải Tân, huyện Hải Lăng, tỉnh Quảng Trị. Gặp nhau tay bắt mặt mừng, vui mừng vô kể.

Tộc Nguyễn Như chúng ta có 3 chi hệ; do chiến tranh và thiên tai làm thất lạc phổ hệ, con cháu tìm về không ráp nối được trọn vẹn, nên tộc thống nhất ghi từ đời thứ 7 – thứ 8 như sau:
1) Hệ Ông Nguyễn Như Đoan – bà Nguyễn Thị Thay — Đời thứ 8, Nhánh 3, Phái 2.
2) Hệ Ông Nguyễn Như Thơ – bà Trương Thị Thừa — Đời thứ 7, Phái 3.
3) Hệ Ông Nguyễn Như Muôn – bà Thị Vợ Nương — Đời thứ 7, Phái 4.

Làng Câu Nhí được thủy tổ 6 tộc đầu tiên lập nên: Nguyễn – Đỗ – Trà – Thân – Trần – Ngô (Lục tộc), xưng theo thứ tự: Nhất Nguyễn, Nhì Thân, Tam Trần, Tứ Đỗ, Ngũ Ngô, Lục Trà; về sau có thêm các tộc khác như Lê, Tăng. Nhà thờ làng được xây tại xóm Miên Lả để thờ các vị tiền hiền, hậu hiền có công với làng, cúng vào ngày 16 tháng Giêng và 16 tháng 8 âm lịch hằng năm (Xuân Kỳ – Thu Tế).

Riêng dòng họ Nguyễn Như chúng ta tổ chức giỗ chạp vào ngày mồng 10 tháng 3 âm lịch hằng năm. Từ năm 1995, lập tục 5 năm tổ chức Hội tổ một lần vào dịp Giỗ tổ Hùng Vương, nhằm hội tụ tôn thân huynh đệ, con cháu nội ngoại, giữ gìn tình huyết thống, thăm hỏi người ốm đau, người già từ 80 tuổi, khuyến học khuyến tài, phát huy truyền thống hiếu học của dòng tộc.

  nhaTho:`Năm Thành Thái thứ 3 (tháng 6 năm 1891), nhà thờ tộc ta được ông cha xây dựng tại xóm Nhà Bối – Mục Mã. Đến đời Vua Duy Tân thứ 7 (tháng 7 năm Quý Sửu 1913), nhà thờ được tu sửa lại. Nhưng đến đời Vua Bảo Đại, dòng sông Thu Bồn bị xói lở, nguy cơ làm sụp đổ từ đường. Tháng 3 năm 1932 (Nhâm Thân), ông cha ta di dời nhà thờ về xứ đất Thanh Sa, xóm Đồng Phú.

function genOf(m){let d=1,cur=m,seen=new Set();
  while(cur&&cur.parentId&&!seen.has(cur.id)){seen.add(cur.id);const p=members.find(x=>x.id===cur.parentId);if(!p)break;cur=p;d++;}
  return d;}

function resizeImage(file,cb){const r=new FileReader();
  r.onload=e=>{const img=new Image();
    img.onload=()=>{const max=240,sc=Math.min(1,max/Math.max(img.width,img.height));
      const cw=Math.round(img.width*sc),ch=Math.round(img.height*sc);

      cv.getContext('2d').drawImage(img,0,0,cw,ch);cb(cv.toDataURL('image/jpeg',0.82));};

function validYear(v){if(!v)return true;return /^\d{3,4}$/.test(v)&&+v>=1&&+v<=(new Date().getFullYear()+1);}
function createsCycle(meId,parentId){let cur=members.find(x=>x.id===parentId),seen=new Set();
  while(cur&&!seen.has(cur.id)){if(cur.id===meId)return true;seen.add(cur.id);cur=members.find(x=>x.id===cur.parentId);}return false;}

/* ---------- xuất GEDCOM (chuẩn gia phả quốc tế) ---------- */
function buildGEDCOM(){
  const idx=new Map();members.forEach((m,i)=>idx.set(m.id,'I'+(i+1)));
  const fams=[];const famOf=new Map();const childFam=new Map();
  // mỗi cha/mẹ có con -> 1 gia đình
  const parents=[...new Set(members.filter(m=>m.parentId&&idx.has(m.parentId)).map(m=>m.parentId))];
  parents.forEach((pid,i)=>{const fid='F'+(i+1);const p=members.find(x=>x.id===pid);
    const sp=p&&p.spouseId?members.find(x=>x.id===p.spouseId):null;
    const kids=members.filter(x=>x.parentId===pid);
    fams.push({fid,husb:p&&p.gender!=='Nữ'?p.id:(sp?sp.id:p.id),wife:p&&p.gender==='Nữ'?p.id:(sp?sp.id:null),kids:kids.map(k=>k.id)});
    famOf.set(pid,fid);if(sp)famOf.set(sp.id,fid);kids.forEach(k=>childFam.set(k.id,fid));});
  let g='0 HEAD\n1 SOUR GiaPhaSo\n1 GEDC\n2 VERS 5.5.1\n2 FORM LINEAGE-LINKED\n1 CHAR UTF-8\n';
  members.forEach(m=>{const I=idx.get(m.id);const parts=m.name.trim().split(/\s+/);const sur=parts[0]||'';const giv=parts.slice(1).join(' ');
    g+=`0 @${I}@ INDI\n1 NAME ${giv} /${sur}/\n1 SEX ${m.gender==='Nữ'?'F':'M'}\n`;
    if(m.birthYear)g+=`1 BIRT\n2 DATE ${m.birthYear}\n`;
    if(m.deathYear)g+=`1 DEAT\n2 DATE ${m.deathYear}\n`;
    if(childFam.has(m.id))g+=`1 FAMC @${childFam.get(m.id)}@\n`;
    if(famOf.has(m.id))g+=`1 FAMS @${famOf.get(m.id)}@\n`;});
  fams.forEach(f=>{g+=`0 @${f.fid}@ FAM\n`;if(f.husb)g+=`1 HUSB @${idx.get(f.husb)}@\n`;if(f.wife)g+=`1 WIFE @${idx.get(f.wife)}@\n`;
    f.kids.forEach(k=>g+=`1 CHIL @${idx.get(k)}@\n`);});
  g+='0 TRLR\n';return g;
}
function exportGEDCOM(){if(!members.length){toast('Chưa có thành viên');return;}
  const blob=new Blob([buildGEDCOM()],{type:'text/plain;charset=utf-8'});const url=URL.createObjectURL(blob),a=document.createElement('a');
  a.href=url;a.download='gia-pha.ged';document.body.appendChild(a);a.click();a.remove();URL.revokeObjectURL(url);toast('Đã xuất file GEDCOM');}

/* ---------- âm lịch (GMT+7) ---------- */
const TZ=7;
const CAN=['Giáp','Ất','Bính','Đinh','Mậu','Kỷ','Canh','Tân','Nhâm','Quý'];
const CHI=['Tý','Sửu','Dần','Mão','Thìn','Tỵ','Ngọ','Mùi','Thân','Dậu','Tuất','Hợi'];
const canChi=y=>CAN[(y+6)%10]+' '+CHI[(y+8)%12];
const LUNAR_FEST={'1-1':'Tết Nguyên Đán','15-1':'Rằm tháng Giêng (Nguyên Tiêu)','3-3':'Tết Hàn Thực',
  '10-3':'Giỗ Tổ Hùng Vương','15-4':'Lễ Phật Đản','5-5':'Tết Đoan Ngọ','15-7':'Vu Lan – Rằm tháng Bảy',
  '15-8':'Tết Trung Thu','9-9':'Tết Trùng Cửu','23-12':'Ông Công Ông Táo'};
function _INT(d){return Math.floor(d);}
function jdFromDate(dd,mm,yy){var a=_INT((14-mm)/12),y=yy+4800-a,m=mm+12*a-3;
  var jd=dd+_INT((153*m+2)/5)+365*y+_INT(y/4)-_INT(y/100)+_INT(y/400)-32045;
  if(jd<2299161)jd=dd+_INT((153*m+2)/5)+365*y+_INT(y/4)-32083;return jd;}
function getNewMoonDay(k,tz){var T=k/1236.85,T2=T*T,T3=T2*T,dr=Math.PI/180;
  var J1=2415020.75933+29.53058868*k+0.0001178*T2-0.000000155*T3;
  J1=J1+0.00033*Math.sin((166.56+132.87*T-0.009173*T2)*dr);
  var M=359.2242+29.10535608*k-0.0000333*T2-0.00000347*T3;
  var Mpr=306.0253+385.81691806*k+0.0107306*T2+0.00001236*T3;
  var F=21.2964+390.67050646*k-0.0016528*T2-0.00000239*T3;
  var C1=(0.1734-0.000393*T)*Math.sin(M*dr)+0.0021*Math.sin(2*dr*M);
  C1=C1-0.4068*Math.sin(Mpr*dr)+0.0161*Math.sin(dr*2*Mpr);C1=C1-0.0004*Math.sin(dr*3*Mpr);
  C1=C1+0.0104*Math.sin(dr*2*F)-0.0051*Math.sin(dr*(M+Mpr));
  C1=C1-0.0074*Math.sin(dr*(M-Mpr))+0.0004*Math.sin(dr*(2*F+M));
  C1=C1-0.0004*Math.sin(dr*(2*F-M))-0.0006*Math.sin(dr*(2*F+Mpr));
  C1=C1+0.0010*Math.sin(dr*(2*F-Mpr))+0.0005*Math.sin(dr*(2*Mpr+M));
  var dt;if(T<-11)dt=0.001+0.000839*T+0.0002261*T2-0.00000845*T3-0.000000081*T*T3;
  else dt=-0.000278+0.000265*T+0.000262*T2;return _INT(J1+C1-dt+0.5+tz/24);}
function getSunLongitude(jdn,tz){var T=(jdn-2451545.5-tz/24)/36525,T2=T*T,dr=Math.PI/180;
  var M=357.52910+35999.05030*T-0.0001559*T2-0.00000048*T*T2;
  var L0=280.46645+36000.76983*T+0.0003032*T2;
  var DL=(1.914600-0.004817*T-0.000014*T2)*Math.sin(dr*M);
  DL=DL+(0.019993-0.000101*T)*Math.sin(dr*2*M)+0.000290*Math.sin(dr*3*M);
  var L=(L0+DL)*dr;L=L-Math.PI*2*_INT(L/(Math.PI*2));return _INT(L/Math.PI*6);}
function getLunarMonth11(yy,tz){var off=jdFromDate(31,12,yy)-2415021,k=_INT(off/29.530588853);
  var nm=getNewMoonDay(k,tz);if(getSunLongitude(nm,tz)>=9)nm=getNewMoonDay(k-1,tz);return nm;}
function getLeapMonthOffset(a11,tz){var k=_INT((a11-2415021.076998695)/29.530588853+0.5);
  var last=0,i=1,arc=getSunLongitude(getNewMoonDay(k+i,tz),tz);
  do{last=arc;i++;arc=getSunLongitude(getNewMoonDay(k+i,tz),tz);}while(arc!=last&&i<14);return i-1;}
function convertSolar2Lunar(dd,mm,yy,tz){var dn=jdFromDate(dd,mm,yy),k=_INT((dn-2415021.076998695)/29.530588853);
  var ms=getNewMoonDay(k+1,tz);if(ms>dn)ms=getNewMoonDay(k,tz);
  var a11=getLunarMonth11(yy,tz),b11=a11,ly;
  if(a11>=ms){ly=yy;a11=getLunarMonth11(yy-1,tz);}else{ly=yy+1;b11=getLunarMonth11(yy+1,tz);}
  var ld=dn-ms+1,diff=_INT((ms-a11)/29),leap=0,lm=diff+11;
  if(b11-a11>365){var lo=getLeapMonthOffset(a11,tz);if(diff>=lo){lm=diff+10;if(diff==lo)leap=1;}}
  if(lm>12)lm-=12;if(lm>=11&&diff<4)ly-=1;return [ld,lm,ly,leap];}
function lunarOf(iso){const d=new Date(iso),r=convertSolar2Lunar(d.getDate(),d.getMonth()+1,d.getFullYear(),TZ);return {d:r[0],m:r[1],y:r[2],leap:r[3]};}
function upcomingLunar(days){const out=[],base=new Date();
  for(let i=0;i<days;i++){const d=new Date(base);d.setDate(base.getDate()+i);
    const r=convertSolar2Lunar(d.getDate(),d.getMonth()+1,d.getFullYear(),TZ);
    const fest=LUNAR_FEST[r[0]+'-'+r[1]];let label=null,type='';
    if(fest){label=fest;type='fest';}else if(r[0]===15){label='Ngày Rằm tháng '+r[1];type='ram';}
    else if(r[0]===1){label='Mùng 1 tháng '+r[1];type='mung';}
    if(label)out.push({date:d,ld:r[0],lm:r[1],ly:r[2],leap:r[3],label,type});}
  return out;}
/* ngày giỗ sắp tới: quét tới trước để tìm lần kế tiếp */
function upcomingGio(daysAhead){
  const out=[],base=new Date();base.setHours(0,0,0,0);
  members.forEach(m=>{
    if(!m.gioDay||!m.gioMonth)return;
    let found=null;
    if(m.gioType==='duong'){
      for(let y=0;y<2;y++){const d=new Date(base.getFullYear()+y,m.gioMonth-1,m.gioDay);
        if(d>=base){found=d;break;}}
    }else{
      for(let i=0;i<420;i++){const d=new Date(base);d.setDate(base.getDate()+i);
        const l=convertSolar2Lunar(d.getDate(),d.getMonth()+1,d.getFullYear(),TZ);
        if(l[0]===m.gioDay&&l[1]===m.gioMonth){found=d;break;}}
    }
    if(found){const diff=(found-base)/86400000;if(diff<=daysAhead)out.push({member:m,date:found});}
  });
  return out.sort((a,b)=>a.date-b.date);
}

/* ---------- GIA PHA ---------- */
function buildGroupedTree(){
  const rendered=new Set();let maxLvl=0;
  function node(m,lvl){
    if(rendered.has(m.id))return '';rendered.add(m.id);if(lvl>maxLvl)maxLvl=lvl;
    const spouse=m.spouseId?members.find(x=>x.id===m.spouseId):null;
    if(spouse)rendered.add(spouse.id);
    const kids=members.filter(x=>(x.parentId===m.id||(spouse&&x.parentId===spouse.id))&&!rendered.has(x.id));
    const kidHTML=kids.map(k=>node(k,lvl+1)).filter(Boolean).join('');
    const hasKids=kidHTML.length>0,collapsed=collapsedNodes.has(m.id);
    const yrs=[m.birthYear,m.deathYear].filter(Boolean).join('–');
    const sy=spouse?[spouse.birthYear,spouse.deathYear].filter(Boolean).join('–'):'';
    const spHTML=spouse?`<span class="spouse">⚭ ${esc(spouse.name)}${sy?` (${sy})`:''}</span>`:'';
    const caret=hasKids?`<button class="caret-btn" title="Thu gọn/mở" onclick="toggleNode('${m.id}')">${collapsed?'▸':'▾'}</button>`:`<span class="caret-sp"></span>`;
    const kcount=hasKids&&collapsed?` <span class="kcount">(${kids.length} con)</span>`:'';
    return `<li>
      <div class="node-row ${m.deathYear?'deceased':''}">
        ${caret}${avatarTag(m)}
        <div class="ninfo"><div class="nm">${esc(m.name)}<span class="doi">đời ${lvl}</span>${kcount}</div>
          <div class="meta">${yrs||'—'}${spHTML}</div></div>
        <span class="nacts">
          <button class="icon-btn" title="Thêm con" onclick="openMemberForm(null,'${m.id}')">➕</button>
          <button class="icon-btn" title="Sửa" onclick="openMemberForm('${m.id}')">✏️</button>
          <button class="icon-btn danger" title="Xoá" onclick="delMember('${m.id}')">🗑️</button>
        </span></div>
      ${hasKids&&!collapsed?`<ul>${kidHTML}</ul>`:''}</li>`;
  }
  const rootList=members.filter(m=>!m.parentId||!members.some(x=>x.id===m.parentId));
  const groups=[],gmap={};
  function add(m){if(rendered.has(m.id))return;const h=node(m,1);if(!h)return;
    const key=m.branch||'__manual__';
    if(!gmap[key]){gmap[key]={key,label:m.branch||'Thành viên tự thêm',items:0,html:''};groups.push(gmap[key]);}
    gmap[key].html+=h;gmap[key].items++;}
  rootList.forEach(add);members.forEach(m=>{if(!rendered.has(m.id))add(m);});
  return {groups,levels:maxLvl};
}
function renderGroupedTree(){
  const {groups}=buildGroupedTree();
  const multi=groups.length>1;
  return groups.map(g=>{
    const col=collapsedGroups.has(g.key);
    return `<div class="grp">
      <div class="grp-h" onclick="toggleGroup('${encodeURIComponent(g.key)}')">
        <span class="caret">${col?'▸':'▾'}</span><span class="grp-t">${esc(g.label)}</span><span class="grp-n">${g.items} gia đình</span></div>
      ${col?'':`<ul class="tree-root">${g.html}</ul>`}
    </div>`;
  }).join('');
}
function toggleGroup(k){k=decodeURIComponent(k);collapsedGroups.has(k)?collapsedGroups.delete(k):collapsedGroups.add(k);render();}
function toggleNode(id){collapsedNodes.has(id)?collapsedNodes.delete(id):collapsedNodes.add(id);render();}
function collapseAll(){members.forEach(m=>{if(members.some(x=>x.parentId===m.id))collapsedNodes.add(m.id);});render();}
function expandAll(){collapsedNodes.clear();collapsedGroups.clear();render();}
let chartZoom=1;
function zoomChart(d){chartZoom=Math.max(0.4,Math.min(1.6,Math.round((chartZoom+d)*10)/10));render();}
function isHead(m){
  if(m.parentId&&members.some(x=>x.id===m.parentId))return false;
  if(m.spouseId){const sp=members.find(x=>x.id===m.spouseId);
    if(sp){if(sp.parentId&&members.some(x=>x.id===sp.parentId))return false;
      if(m.gender==='Nam'&&sp.gender!=='Nam')return true;
      if(sp.gender==='Nam'&&m.gender!=='Nam')return false;
      return members.indexOf(m)<members.indexOf(sp);}}
  return true;
}
function renderChart(){
  const heads=members.filter(isHead);
  const groups=[],gmap={};
  heads.forEach(m=>{const key=m.branch||'__manual__';
    if(!gmap[key]){gmap[key]={key,label:m.branch||'Gia phả',roots:[]};groups.push(gmap[key]);}
    gmap[key].roots.push(m);});
  const rendered=new Set();
  function box(m,lvl){const spouse=m.spouseId?members.find(x=>x.id===m.spouseId):null;
    const yrs=[m.birthYear,m.deathYear].filter(Boolean).join('–');
    return `<div class="obox ${m.deathYear?'dead':''}" onclick="openMemberForm('${m.id}')">
      <div class="ob-n">${esc(m.name)}</div>
      ${spouse?`<div class="ob-s">⚭ ${esc(spouse.name)}</div>`:''}
      <div class="ob-d">đời ${lvl}${yrs?' · '+yrs:''}</div></div>`;}
  function node(m,lvl){if(rendered.has(m.id))return '';rendered.add(m.id);
    const spouse=m.spouseId?members.find(x=>x.id===m.spouseId):null;if(spouse)rendered.add(spouse.id);
    const kids=members.filter(x=>(x.parentId===m.id||(spouse&&x.parentId===spouse.id))&&!rendered.has(x.id));
    const kidHTML=kids.map(k=>node(k,lvl+1)).filter(Boolean).join('');
    return `<li>${box(m,lvl)}${kidHTML?`<ul>${kidHTML}</ul>`:''}</li>`;}
  return groups.map(g=>{
    const inner=g.roots.map(r=>node(r,1)).filter(Boolean).join('');
    return `<div class="chart-block">
      <div class="chart-title">${esc(g.label)} <span style="font-weight:600;color:var(--ink-soft);font-size:13px">· ${g.roots.length} gia đình</span></div>
      <div class="chart-scroll"><div class="chart" style="transform:scale(${chartZoom})">
        <div class="orgtree"><ul><li><div class="obox root"><div class="ob-n">${esc(g.label)}</div></div>${inner?`<ul>${inner}</ul>`:''}</li></ul></div>
      </div></div></div>`;
  }).join('');
}
function viewGiaPha(){
  const lvls=members.length?maxGen():0;
  const chart=members.length?renderChart():`<div class="empty"><div class="ico">🌱</div>
    <div class="big">Chưa có thành viên nào</div><div>Nhấn [+ Thêm thành viên] để bắt đầu</div></div>`;

    ${members.length?`<button class="pill" onclick="exportPDF()">📄 PDF</button><button class="pill" onclick="exportGEDCOM()">🌐 GEDCOM</button>`:''}
    ${undoStack.length?`<button class="pill" onclick="undo()">↩️ Hoàn tác</button>`:''}
    ${doi11Imported()?`<button class="pill" onclick="removeDoi11()">🗑️ Xoá dữ liệu nhập</button>`:`<button class="pill" onclick="importDoi11()">📥 Nhập gia phả</button>`}

}

  const tl=lunarOf(isoDay(now));

async function doRegister(){const name=$('ac_name').value.trim(),u=$('ac_user').value.trim(),p=$('ac_pass').value,p2=$('ac_pass2').value;
  if(!name||!u||!p){toast('Vui lòng điền đủ thông tin');return;}

  if(p!==p2){toast('Mật khẩu nhập lại không khớp');return;}
  if(CLOUD){const {data,error}=await sb.auth.signUp({email:u,password:p,options:{data:{name}}});
    if(error){toast(error.message);return;}
    if(data&&data.session){await loadSession();await reloadData();toast('Tạo tài khoản thành công');render();}
    else{toast('Đã gửi email xác nhận – kiểm tra hộp thư rồi đăng nhập');acctMode='login';render();}

async function doLogin(){const u=$('ac_user').value.trim(),p=$('ac_pass').value;

    if(error){toast('Sai email hoặc mật khẩu');return;}
    await loadSession();await reloadData();toast('Đăng nhập thành công');render();return;}
  const a=accounts.find(x=>x.username.toLowerCase()===u.toLowerCase()&&x.password===p);

/* ---------- BACKUP / RESTORE ---------- */
function exportData(){
  const data={app:'giaphaso',version:2,exportedAt:new Date().toISOString(),members,events,accounts};
  const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob),a=document.createElement('a'),dt=new Date();
  a.href=url;a.download=`gia-pha-backup-${dt.getFullYear()}${String(dt.getMonth()+1).padStart(2,'0')}${String(dt.getDate()).padStart(2,'0')}.json`;
  document.body.appendChild(a);a.click();a.remove();URL.revokeObjectURL(url);toast('Đã xuất file sao lưu');
}
function importData(inp){const f=inp.files&&inp.files[0];if(!f)return;inp.value='';
  const r=new FileReader();
  r.onload=e=>{try{const d=JSON.parse(e.target.result);
    if(!d||(!Array.isArray(d.members)&&!Array.isArray(d.events))){toast('File không hợp lệ');return;}
    pendingImport=d;
    openModal(`<h2 style="color:var(--maroon)">Khôi phục dữ liệu?</h2>
      <p style="text-align:center;color:var(--ink-soft)">File có <b>${(d.members||[]).length}</b> thành viên, <b>${(d.events||[]).length}</b> sự kiện.<br>Dữ liệu hiện tại sẽ bị <b>thay thế</b>.</p>
      <button class="primary" onclick="confirmImport()">Khôi phục</button><button class="ghost" onclick="pendingImport=null;closeModal()">Huỷ</button>`);
  }catch(err){toast('Không đọc được file');}};
  r.readAsText(f);
}
async function confirmImport(){if(needAuth())return;const d=pendingImport;if(!d)return;
  snapshot();
  members=Array.isArray(d.members)?d.members:[];events=Array.isArray(d.events)?d.events:[];
  if(Array.isArray(d.accounts))accounts=d.accounts;
  await Store.set('members',members);await Store.set('events',events);await Store.set('accounts',accounts);
  pendingImport=null;closeModal();toast('Đã khôi phục dữ liệu');render();}

async function saveMember(id){
  const name=$('m_name').value.trim();if(!name){toast('Vui lòng nhập họ và tên');return;}
  const by=$('m_by').value.trim(),dy=$('m_dy').value.trim();
  if(!validYear(by)){toast('Năm sinh không hợp lệ');return;}
  if(!validYear(dy)){toast('Năm mất không hợp lệ');return;}
  if(by&&dy&&+dy<+by){toast('Năm mất phải sau năm sinh');return;}
  let parentId=$('m_parent').value||'';const spouseId=$('m_spouse').value||'';
  if(parentId&&parentId===id){toast('Không thể chọn chính mình làm cha/mẹ');parentId='';}
  if(parentId&&id&&createsCycle(id,parentId)){toast('Quan hệ này tạo vòng lặp (chọn con/cháu làm cha/mẹ)');return;}
  snapshot();
  const data={name,birthYear:by,deathYear:dy,gender:$('m_gender').value,
    parentId,spouseId,phone:$('m_phone').value.trim(),occupation:$('m_job').value.trim(),hometown:$('m_home').value.trim(),
    gioDay:parseInt($('m_gio_d').value)||0,gioMonth:parseInt($('m_gio_m').value)||0,gioType:$('m_gio_t').value,
    notes:$('m_note').value.trim(),avatar:formAvatar};
  let mid=id;
  if(id){const i=members.findIndex(x=>x.id===id);members[i]={...members[i],...data};}
  else{mid=uid();members.push({id:mid,...data});}
  // vợ/chồng hai chiều
  if(spouseId){members.forEach(x=>{if(x.id!==mid&&x.spouseId===mid&&x.id!==spouseId)x.spouseId='';});
    const sp=members.find(x=>x.id===spouseId);if(sp)sp.spouseId=mid;}
  else{members.forEach(x=>{if(x.spouseId===mid)x.spouseId='';});}
  await Store.set('members',members);closeModal();toast(id?'Đã cập nhật':'Đã thêm thành viên');render();
}
function delMember(id){if(needAuth())return;const m=members.find(x=>x.id===id);const kids=members.filter(x=>x.parentId===id).length;
  openModal(`<h2 style="color:var(--maroon)">Xoá thành viên?</h2>
    <p style="text-align:center;color:var(--ink-soft)">Xoá <b>${esc(m.name)}</b>?${kids?` <br><b>${kids}</b> người con sẽ trở thành gốc riêng.`:''} Không thể hoàn tác.</p>
    <button class="primary" onclick="confirmDelMember('${id}')">Xoá</button><button class="ghost" onclick="closeModal()">Huỷ</button>`);}
async function confirmDelMember(id){
  snapshot();
  members=members.filter(x=>x.id!==id);
  members.forEach(x=>{if(x.parentId===id)x.parentId='';if(x.spouseId===id)x.spouseId='';});
  await Store.set('members',members);closeModal();toast('Đã xoá thành viên');render();}

function doi11Imported(){return members.some(m=>m.src==='doi11');}
function noTone(s){return (s||'').normalize('NFD').replace(/[\u0300\u0301\u0303\u0309\u0323]/g,'').normalize('NFC').toLowerCase();}
function gkey(name){return noTone((name||'').replace(/\(.*?\)/g,'').replace(/tức.*$/,'').trim().split(/\s+/).pop());}
function gkeys(name){const ks=[];const base=(name||'').replace(/\(.*?\)/g,'').trim().split(/\s+/).pop();if(base)ks.push(noTone(base));(name.match(/\(([^)]+)\)/g)||[]).forEach(p=>{const t=p.replace(/[()]/g,'').replace(/^tức\s*/i,'').trim().split(/\s+/).pop();if(t)ks.push(noTone(t));});return [...new Set(ks)];}
function wkey(name){return /quý nương$|^thị$|^thị quý nương$/i.test((name||'').trim())?'':gkey(name);}
function buildImportMembers(){
  const out=[],reg={};
  const generic=n=>!n||/^(thị|thị quý nương)$/i.test((n||'').trim());
  function regMale(branch,name,id){reg[branch]=reg[branch]||{};const rec={id,wife:''};gkeys(name).forEach(k=>{(reg[branch][k]=reg[branch][k]||[]).push(rec);});return rec;}
  function findFather(branch,fName,mName){const b=reg[branch]||{};const c=b[gkey(fName)];const mk=wkey(mName);
    if(c&&c.length){if(c.length===1)return c[0].id;const hit=mk&&c.find(x=>x.wife&&x.wife===mk);return (hit||c[0]).id;}
    if(mk){for(const k in b){const f=b[k].find(x=>x.wife===mk);if(f)return f.id;}}
    return null;}
  function mkKids(kids,fid,branch,gen){let lastSon=null,lastRec=null;
    kids.forEach(c=>{const role=c[0],name=c[1],ky=c[2],note=c[3];if(!name)return;
      const rec={id:uid(),name,gender:role==='kh'?'Nam':'Nữ',src:'doi11',branch,gen};
      if(ky){const p=String(ky).split('.');rec.gioDay=parseInt(p[0])||0;rec.gioMonth=parseInt(p[1])||0;rec.gioType='am';}
      const notes=[];
      if(role==='kh'||role==='co'){rec.parentId=fid;notes.push('Đời '+gen+' · '+branch);if(role==='kh'){lastSon=rec;lastRec=regMale(branch,name,rec.id);}}
      else if(role==='ty'){if(lastSon){rec.spouseId=lastSon.id;if(!lastSon.spouseId)lastSon.spouseId=rec.id;}if(lastRec&&!lastRec.wife)lastRec.wife=wkey(name);notes.push('Con dâu');}
      else{if(lastRec&&!lastRec.wife)lastRec.wife=wkey(name);notes.push('Vợ thứ'+(lastSon?' của '+lastSon.name:''));}
      if(note)notes.push(note);rec.notes=notes.join(' · ');out.push(rec);});
  }
  DOI11.forEach(f=>{const fid=uid(),mid=uid();
    out.push({id:fid,name:'Nguyễn Như '+f.f,gender:'Nam',spouseId:mid,src:'doi11',branch:f.s,gen:10,notes:'Đời 10 · '+f.s});
    out.push({id:mid,name:f.m,gender:'Nữ',spouseId:fid,src:'doi11',branch:f.s,gen:10,notes:'Đời 10 · '+f.s});
    const fr=regMale(f.s,f.f,fid);fr.wife=wkey(f.m);mkKids(f.k,fid,f.s,11);});
  (typeof DOI12!=='undefined'?DOI12:[]).forEach(f=>{
    let fid=findFather(f.s,f.f,f.m);
    if(!fid){fid=uid();const fa={id:fid,name:'Nguyễn Như '+f.f,gender:'Nam',src:'doi11',branch:f.s,gen:11,notes:'Đời 11 · '+f.s+' · (chưa nối được đời trên)'};out.push(fa);
      if(!generic(f.m)){const mm=uid();out.push({id:mm,name:f.m,gender:'Nữ',spouseId:fid,src:'doi11',branch:f.s,gen:11});fa.spouseId=mm;}
      const fr=regMale(f.s,f.f,fid);fr.wife=wkey(f.m);}
    else{const fa=out.find(x=>x.id===fid);if(fa&&!fa.spouseId&&!generic(f.m)){const mm=uid();out.push({id:mm,name:f.m,gender:'Nữ',spouseId:fid,src:'doi11',branch:f.s,gen:fa.gen});fa.spouseId=mm;}}
    mkKids(f.k,fid,f.s,12);
  });
  return out;
}
function importDoi11(){if(needAuth())return;
  openModal(`<h2 style="color:var(--maroon)">Nhập gia phả vào cây?</h2>
    <p style="text-align:center;color:var(--ink-soft)">Nhập toàn bộ <b>Đời 10, 11, 12</b> của tộc Nguyễn Như – Câu Nhí: tự nối cha–con qua các đời, vợ/chồng và ngày giỗ (kỵ).</p>
    <p class="note">Có thể bấm Hoàn tác hoặc "Xoá dữ liệu nhập" để gỡ ra sau.</p>
    <button class="primary" onclick="confirmImportDoi11()">Nhập vào cây</button>
    <button class="ghost" onclick="closeModal()">Huỷ</button>`);
}
async function confirmImportDoi11(){
  snapshot();const add=buildImportMembers();
  members=members.concat(add);await Store.set('members',members);
  closeModal();toast('Đã nhập '+add.length+' người');render();
}
function removeDoi11(){if(needAuth())return;
  openModal(`<h2 style="color:var(--maroon)">Xoá dữ liệu nhập?</h2>
    <p style="text-align:center;color:var(--ink-soft)">Gỡ toàn bộ người đã nhập từ gia phả gốc (Đời 10–12) ra khỏi cây (không ảnh hưởng người bạn tự thêm).</p>
    <button class="primary" onclick="confirmRemoveDoi11()">Xoá</button><button class="ghost" onclick="closeModal()">Huỷ</button>`);
}
async function confirmRemoveDoi11(){snapshot();members=members.filter(m=>m.src!=='doi11');await Store.set('members',members);closeModal();toast('Đã xoá dữ liệu Đời 11');render();}

/* ---------- EVENT FORM ---------- */
function openEventForm(presetDate,id){if(needAuth())return;const e=id?events.find(x=>x.id===id):{};const date=e.date||presetDate||isoDay(new Date());
  openModal(`<h2>📅 ${id?'Sửa Sự Kiện':'Thêm Sự Kiện'}</h2>
    <label>Tên sự kiện <span class="req">*</span></label><input class="f" id="e_title" placeholder="VD: Họp họ hàng năm" value="${esc(e.title||'')}">
    <label>Ngày diễn ra <span class="req">*</span></label><input class="f" id="e_date" type="date" value="${date}">
    <label>Mô tả</label><textarea class="f" id="e_desc" placeholder="Địa điểm, nội dung...">${esc(e.desc||'')}</textarea>
    <button class="primary" onclick="saveEvent('${id||''}')">💾 Lưu sự kiện</button><button class="ghost" onclick="closeModal()">Huỷ</button>`);}
async function saveEvent(id){const title=$('e_title').value.trim(),date=$('e_date').value,desc=$('e_desc').value.trim();
  if(!title){toast('Vui lòng nhập tên sự kiện');return;}if(!date){toast('Vui lòng chọn ngày');return;}
  snapshot();
  if(id){const i=events.findIndex(x=>x.id===id);events[i]={...events[i],title,date,desc};}else events.push({id:uid(),title,date,desc});
  await Store.set('events',events);closeModal();toast(id?'Đã cập nhật sự kiện':'Đã thêm sự kiện');render();}
function delEvent(id){if(needAuth())return;const e=events.find(x=>x.id===id);
  openModal(`<h2 style="color:var(--maroon)">Xoá sự kiện?</h2><p style="text-align:center;color:var(--ink-soft)">Xoá <b>${esc(e.title)}</b> (${fmtDate(e.date)})?</p>
    <button class="primary" onclick="confirmDelEvent('${id}')">Xoá</button><button class="ghost" onclick="closeModal()">Huỷ</button>`);}
async function confirmDelEvent(id){snapshot();events=events.filter(x=>x.id!==id);await Store.set('events',events);closeModal();toast('Đã xoá sự kiện');render();}

setInterval(()=>{if(tab==='sukien'){const c=document.querySelector('.clock .t');
  if(c){const n=new Date();c.textContent=String(n.getHours()).padStart(2,'0')+':'+String(n.getMinutes()).padStart(2,'0');}}},30000);

init();
</script>
