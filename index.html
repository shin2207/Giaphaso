<style>
:root{
  --maroon:#8a1818; --maroon-d:#6f1212; --maroon-l:#a83030;
  --gold:#c9981f; --gold-l:#e0b53f; --gold-soft:#f3e6c4;
  --cream:#fbf2e9; --cream-2:#f6ead9;
  --card:#ffffff; --line:#efe1c9;
  --ink:#5a3a22; --ink-soft:#8a6a4a; --muted:#b89a6f;
  --shadow:0 6px 20px rgba(110,40,20,.08);
  --shadow-lg:0 14px 36px rgba(110,40,20,.16);
  --serif:'Noto Serif',Georgia,'Times New Roman',serif;
  --sans:'Be Vietnam Pro',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{font-family:var(--sans);
  background:var(--cream);color:var(--ink);padding-bottom:104px;
  background-image:radial-gradient(circle at 50% -10%,rgba(201,152,31,.10),transparent 60%),repeating-linear-gradient(0deg,transparent,transparent 30px,rgba(201,152,31,.035) 31px);}
h1,h2,h3{margin:0}
h1,h2,h3,.section-title,.chart-title,.brand h1,.stat .num,.clan-banner h2,.grp-h,.hero h2{font-family:var(--serif)}
button{font-family:inherit;cursor:pointer;border:none}
input,select,textarea{font-family:inherit;font-size:15px}

header{position:sticky;top:0;z-index:30;background:linear-gradient(180deg,var(--maroon-l),var(--maroon-d));
  color:#fff;padding:14px 18px;display:flex;align-items:center;gap:12px;box-shadow:0 6px 18px rgba(80,20,10,.3);
  border-bottom:2px solid var(--gold)}
.logo{width:46px;height:46px;border-radius:50%;flex:none;
  background:radial-gradient(circle at 35% 30%,var(--gold-l),var(--gold));
  display:flex;align-items:center;justify-content:center;font-size:24px;
  border:2px solid rgba(255,255,255,.55);box-shadow:0 3px 10px rgba(0,0,0,.3)}
.brand h1{font-size:21px;letter-spacing:.4px;font-weight:700}
.brand p{margin:2px 0 0;font-size:12px;opacity:.88;font-style:italic;letter-spacing:.2px}
.add-btn{margin-left:auto;background:linear-gradient(180deg,var(--gold-l),var(--gold));color:#5a3a08;
  font-weight:700;padding:10px 16px;border-radius:24px;font-size:14px;box-shadow:0 3px 10px rgba(0,0,0,.22);white-space:nowrap;border:1px solid rgba(255,255,255,.3)}
.add-btn:active{transform:translateY(1px)}

main{max-width:980px;margin:0 auto;padding:18px 16px 8px}
.hero{position:relative;overflow:hidden;border-radius:20px;padding:20px 22px;margin:0 0 16px;color:#fff;
  background:linear-gradient(135deg,var(--maroon-d) 0%,var(--maroon) 55%,var(--maroon-l) 100%);

const DEFAULT_PHAKY={
  tua:`Nhân nay đất nước thanh bình an lạc, để chuẩn bị cho Lễ Hội tổ 5 năm lần thứ 6 (1995–2025), chúng tôi tập trung huy động các chi phái trong tộc cung cấp thông tin các hệ đời để thiết lập bảng tông đồ dòng tộc và quyển tộc phả từ đời thứ 11 đến đời 17 để lại cho con cháu mai sau làm cơ sở; hằng năm vào ngày giỗ chạp tiếp tục ghi chép các đời con cháu sinh sau.

Nước có quốc sử, nhà có gia phả. Để biết tổ tiên ta từ đâu mà đến, thứ tự Phái – Chi – Nhánh, lớp lang để xưng hô cho đúng đạo lý, phải biết tôn trọng giữ gìn những gì ông cha để lại, giữ gìn bản sắc văn hóa dân tộc, thuần phong mỹ tục; cốt lõi là phải duy trì cái tâm, cái đức hạnh con người, luôn nhớ về tiên tổ cội nguồn — đó là điều nhắc nhở đạo hiếu. Hằng năm vào dịp giỗ chạp, lễ tết, con cháu phải đoàn kết một lòng, trên thuận dưới hòa, tập trung tổ chức các nghi thức cúng bái, thể hiện cái tâm, cái đức, không cần rình rang linh đình.

Chúng ta đang sống trong thời đại kim tiền, vật chất; nếu lơ đãng xa rời dòng họ thì sẽ bị mai một. Không sinh hoạt cùng tộc họ là nguy cơ suy đồi đạo đức. Cho nên dù giàu có hay nghèo hèn cũng phải chung lưng đấu cật, thương yêu, dìu dắt nhau cùng phát triển để tồn tại, phát huy truyền thống uống nước nhớ nguồn mà vượt qua những vướng mắc còn tồn tại và luôn hướng về cội nguồn.

Thành tâm cầu nguyện cho con cháu tộc Nguyễn Như làng Câu Nhí đời đời bền vững.

Điện Minh, ngày mồng một tháng hai năm Ất Tỵ (2025)

Nguyễn Lượm đời thứ 12 biên soạn.
Nguyễn Như Tuân và Nguyễn Như Minh đời thứ 12 lo in ấn.`,
  hinhThanh:`Theo dòng lịch sử và các ghi chép của tộc họ Nguyễn trong nước, dòng họ Nguyễn khởi nguồn từ quận Trần Lưu, tỉnh Hà Đông, năm (924–979) quá nhập Nam Thiên.

Ngài tổ dòng họ ta cách đây mấy ngàn năm ở ngoài Bắc đi vào xứ Thanh Hóa, tỉnh Thanh Hóa, khai cơ lập nghiệp, kiến canh ruộng đất được hơn 700 mẫu. Do phân chia ruộng đất không đều nên người con thứ là Nguyễn Phước Thức, vào năm Cảnh Long thứ 2, ngày 15 tháng 5, đi vào Quảng Trị, tỉnh (phủ) Hải Lăng, huyện Phú Lộc lập xã. Tại đây ngài Nguyễn Phước Thức đã sinh hạ được 5 trai 4 gái và đổi thành Nguyễn Như. Ở Quảng Trị ngài đã khai canh ruộng đất được hơn 600 mẫu, sinh ra các ngài: Nguyễn Như Thăng, Nguyễn Như Chức, Nguyễn Như Chương, Nguyễn Như Thuyên, Nguyễn Như Hoành và Nguyễn Như Thị Sự.

Tháng tư nhuận năm Kỷ Tỵ (Vĩnh Dụ thứ 12), phụng chỉ dụ vào Nam. Năm Cảnh Hưng thứ nhất, ngày 15 tháng 5 năm 1740, ngài tổ để ngài Nguyễn Như Thuyên cùng các nàng dâu ở lại Quảng Trị canh tác ruộng đất, nuôi dưỡng cha mẹ; còn ngài Nguyễn Như Thăng và con trai là Nguyễn Như Đệ, cùng em là Nguyễn Như Chức với 4 con trai của ngài Như Chức — Như Triều (tức Công Tuấn), Như Hữu (tức Đình Nhơn), Như Hùng (tức Như Tác), Như Hạnh (tức Văn Xá) — đi thuyền từ Quảng Trị vào Quảng Nam, huyện Diên Khánh (nay là Điện Bàn). Ngài Nguyễn Như Thăng khai khẩn ruộng đất được hơn 600 mẫu, lập xã hiệu Câu Nhí cùng các tộc khác trong làng.

Sau năm 1975, khi đất nước thanh bình, cuộc sống ổn định, qua thời gian đi tìm lại cội nguồn và thông tin từ dòng họ Nguyễn Quảng Nam – Đà Nẵng: ngài Nguyễn Như Chương vào khai canh lập nghiệp tại làng Châu Lâu, xã Điện Thọ, lập nhà thờ tộc; còn con ngài Nguyễn Như Chức là Nguyễn Như Đơn vào khai cơ lập nghiệp tại làng Trà Kiệu, huyện Duy Xuyên (tiền hiền tại Trà Kiệu).

Vào những năm 2011–2017, tộc ta cùng Nguyễn Như Bằng An và Nguyễn Như Châu Lâu tổ chức hành hương đi tìm cội nguồn và đã tìm được tộc Nguyễn Như ở làng Câu Nhí, xã Hải Tân, huyện Hải Lăng, tỉnh Quảng Trị. Gặp nhau tay bắt mặt mừng, vui mừng vô kể.

Tộc Nguyễn Như chúng ta có 3 chi hệ; do chiến tranh và thiên tai làm thất lạc phổ hệ, con cháu tìm về không ráp nối được trọn vẹn, nên tộc thống nhất ghi từ đời thứ 7 – thứ 8 như sau:
1) Hệ Ông Nguyễn Như Đoan – bà Nguyễn Thị Thay — Đời thứ 8, Nhánh 3, Phái 2.
2) Hệ Ông Nguyễn Như Thơ – bà Trương Thị Thừa — Đời thứ 7, Phái 3.
3) Hệ Ông Nguyễn Như Muôn – bà Thị Vợ Nương — Đời thứ 7, Phái 4.

Làng Câu Nhí được thủy tổ 6 tộc đầu tiên lập nên: Nguyễn – Đỗ – Trà – Thân – Trần – Ngô (Lục tộc), xưng theo thứ tự: Nhất Nguyễn, Nhì Thân, Tam Trần, Tứ Đỗ, Ngũ Ngô, Lục Trà; về sau có thêm các tộc khác như Lê, Tăng. Nhà thờ làng được xây tại xóm Miên Lả để thờ các vị tiền hiền, hậu hiền có công với làng, cúng vào ngày 16 tháng Giêng và 16 tháng 8 âm lịch hằng năm (Xuân Kỳ – Thu Tế).

Riêng dòng họ Nguyễn Như chúng ta tổ chức giỗ chạp vào ngày mồng 10 tháng 3 âm lịch hằng năm. Từ năm 1995, lập tục 5 năm tổ chức Hội tổ một lần vào dịp Giỗ tổ Hùng Vương, nhằm hội tụ tôn thân huynh đệ, con cháu nội ngoại, giữ gìn tình huyết thống, thăm hỏi người ốm đau, người già từ 80 tuổi, khuyến học khuyến tài, phát huy truyền thống hiếu học của dòng tộc.

(Phần tìm hiểu trên còn nhiều thiếu sót; kính mong anh chị em, con cháu trong gia tộc thông cảm và đóng góp thêm để cùng làm rõ quá trình hình thành và phát triển dòng họ Nguyễn Như. — Nguyễn Lượm)`,
  nhaTho:`Năm Thành Thái thứ 3 (tháng 6 năm 1891), nhà thờ tộc ta được ông cha xây dựng tại xóm Nhà Bối – Mục Mã. Đến đời Vua Duy Tân thứ 7 (tháng 7 năm Quý Sửu 1913), nhà thờ được tu sửa lại. Nhưng đến đời Vua Bảo Đại, dòng sông Thu Bồn bị xói lở, nguy cơ làm sụp đổ từ đường. Tháng 3 năm 1932 (Nhâm Thân), ông cha ta di dời nhà thờ về xứ đất Thanh Sa, xóm Đồng Phú.

Sau 30 năm (1963), do mưa nắng thời gian làm nhà thờ xuống cấp, ông cha ta tiếp tục đại trùng tu. Từ năm 1963 đến năm 1975 bị chiến tranh tàn phá từ đường, bom đạn làm hư hỏng dột nát; nên vào năm 1994 con cháu dốc tâm sức, tài lực đại trùng tu một lần nữa và khánh thành vào ngày 9 tháng 4 năm 1995 (nhằm ngày mồng 10 tháng 3 năm Ất Hợi).

Sau 30 năm (2025), nhà thờ lại bị dột nát; con cháu quyết tâm đóng góp tiền tài, lợp lại mái nhà thờ với kinh phí hơn 300 triệu đồng để thờ phụng tổ tiên dòng họ.`

   Để CHỈ một số người được sửa: điền email của họ vào EDITOR_EMAILS, ví dụ:

   Để trống = ai đăng nhập cũng sửa được (vẫn nên có RLS trên Supabase). */
const EDITOR_EMAILS=[];
function canEdit(){
  if(!CLOUD)return true;
  if(!EDITOR_EMAILS.length)return true;
  if(!currentUser)return false;
  return EDITOR_EMAILS.map(e=>e.toLowerCase()).includes((currentUser.username||'').toLowerCase());
}
function needAuth(){return false;}
async function sha256(str){
  try{const buf=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(str));
    return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');}
  catch(e){return 'plain:'+str;}}
/* Lưu members an toàn hơn khi dùng chung cloud: gộp theo updatedAt (sửa mới nhất thắng),
   giảm mất thay đổi khi hai người sửa gần nhau. Xoá vẫn ghi đè toàn mảng (last-write-wins). */
async function commitMembers(){
  if(CLOUD){try{
    const remote=await Store.get('members',null);
    if(Array.isArray(remote)&&remote.length){
      const map=new Map();remote.forEach(r=>map.set(r.id,r));
      members.forEach(l=>{const r=map.get(l.id);if(!r||(l.updatedAt||0)>=(r.updatedAt||0))map.set(l.id,l);});
      members=[...map.values()];
    }
  }catch(e){}}
  await Store.set('members',members);
}
function fmtDate(s){if(!s)return'';const dt=new Date(s);return dt.getDate()+'/'+(dt.getMonth()+1)+'/'+dt.getFullYear();}
function isoDay(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;}
function avatarTag(m){return m.avatar?`<img class="av" src="${esc(m.avatar)}" alt="">`:`<div class="av">${m.gender==='Nữ'?'👩':'👨'}</div>`;}
let _genCache=new Map();
let _childIdx=null;
function _kidsOf(id){if(!_childIdx){_childIdx=new Map();for(const x of members){if(x.parentId){let a=_childIdx.get(x.parentId);if(!a){a=[];_childIdx.set(x.parentId,a);}a.push(x);}}}return _childIdx.get(id)||[];}
function clearGenCache(){_genCache.clear();_childIdx=null;}
function genOf(m){if(!m)return 1;
  if(_genCache.has(m.id))return _genCache.get(m.id);
  let g;
  if(m.gen)g=+m.gen;
  else if(!m.parentId)g=1;
  else{const p=members.find(x=>x.id===m.parentId);
    if(!p||p.id===m.id)g=1;
    else{_genCache.set(m.id,1);g=genOf(p)+1;}}
  _genCache.set(m.id,g);return g;}
function maxGen(){return members.reduce((a,m)=>Math.max(a,genOf(m)),0);}
function isDeceased(m){return !!(m.deathYear||m.gioDay);}
function resizeImage(file,cb){const r=new FileReader();
  r.onload=e=>{const img=new Image();
    img.onload=()=>{const max=240,sc=Math.min(1,max/Math.max(img.width,img.height));

/* ---------- xuất GEDCOM (chuẩn gia phả quốc tế) ---------- */
function buildGEDCOM(){
  const idx=new Map();members.forEach((m,i)=>idx.set(m.id,'I'+(i+1)));
  const fams=[];const famOf=new Map();const childFam=new Map();
  // mỗi cha/mẹ có con -> 1 gia đình
  const parents=[...new Set(members.filter(m=>m.parentId&&idx.has(m.parentId)).map(m=>m.parentId))];
  parents.forEach((pid,i)=>{const fid='F'+(i+1);const p=members.find(x=>x.id===pid);
    const sp=p&&p.spouseId?members.find(x=>x.id===p.spouseId):null;
    const kids=members.filter(x=>x.parentId===pid);
    fams.push({fid,husb:p&&p.gender!=='Nữ'?p.id:(sp?sp.id:p.id),wife:p&&p.gender==='Nữ'?p.id:(sp?sp.id:null),kids:kids.map(k=>k.id)});
    famOf.set(pid,fid);if(sp)famOf.set(sp.id,fid);kids.forEach(k=>childFam.set(k.id,fid));});
  let g='0 HEAD\n1 SOUR GiaPhaSo\n1 GEDC\n2 VERS 5.5.1\n2 FORM LINEAGE-LINKED\n1 CHAR UTF-8\n';
  members.forEach(m=>{const I=idx.get(m.id);const parts=m.name.trim().split(/\s+/);const sur=parts[0]||'';const giv=parts.slice(1).join(' ');
    g+=`0 @${I}@ INDI\n1 NAME ${giv} /${sur}/\n1 SEX ${m.gender==='Nữ'?'F':'M'}\n`;
    if(m.birthYear)g+=`1 BIRT\n2 DATE ${m.birthYear}\n`;
    if(m.deathYear)g+=`1 DEAT\n2 DATE ${m.deathYear}\n`;
    if(childFam.has(m.id))g+=`1 FAMC @${childFam.get(m.id)}@\n`;
    if(famOf.has(m.id))g+=`1 FAMS @${famOf.get(m.id)}@\n`;});
  fams.forEach(f=>{g+=`0 @${f.fid}@ FAM\n`;if(f.husb)g+=`1 HUSB @${idx.get(f.husb)}@\n`;if(f.wife)g+=`1 WIFE @${idx.get(f.wife)}@\n`;
    f.kids.forEach(k=>g+=`1 CHIL @${idx.get(k)}@\n`);});
  g+='0 TRLR\n';return g;
}

  a.href=url;a.download='gia-pha.ged';document.body.appendChild(a);a.click();a.remove();URL.revokeObjectURL(url);toast('Đã xuất file GEDCOM');}
/* ---------- nhập GEDCOM ---------- */
function parseGEDCOM(text){
  const lines=text.split(/\r?\n/);const indis={},fams=[];let cur=null,curType=null,sub=null;
  for(const raw of lines){const line=raw.trim();if(!line)continue;
    const m=line.match(/^(\d+)\s+(.*)$/);if(!m)continue;
    const level=+m[1];const rest=m[2];
    if(level===0){sub=null;const rec=rest.match(/^@([^@]+)@\s+(\w+)/);
      if(rec&&rec[2]==='INDI'){cur=rec[1];curType='INDI';indis[cur]={id:cur,name:'',sex:'',by:'',dy:''};}
      else if(rec&&rec[2]==='FAM'){cur=rec[1];curType='FAM';fams.push({id:cur,husb:'',wife:'',chil:[]});}
      else{cur=null;curType=null;}continue;}
    if(!cur)continue;
    const tm=rest.match(/^(\w+)\s*(.*)$/);if(!tm)continue;
    const tag=tm[1],val=(tm[2]||'').trim();
    if(curType==='INDI'){const I=indis[cur];
      if(level===1){sub=tag;
        if(tag==='NAME'){const nm=val.match(/^(.*?)\/(.*?)\//);
          if(nm){const giv=(nm[1]||'').trim(),sur=(nm[2]||'').trim();I.name=(sur+' '+giv).trim()||val.replace(/\//g,'').trim();}
          else I.name=val.replace(/\//g,'').trim();}
        else if(tag==='SEX')I.sex=val.toUpperCase().startsWith('F')?'Nữ':'Nam';}
      else if(level===2&&tag==='DATE'){const yr=(val.match(/(\d{3,4})\b/)||[])[1]||'';if(sub==='BIRT')I.by=yr;else if(sub==='DEAT')I.dy=yr;}}
    else if(curType==='FAM'){const f=fams[fams.length-1];if(level===1){const ref=(val.match(/@([^@]+)@/)||[])[1]||'';
      if(tag==='HUSB')f.husb=ref;else if(tag==='WIFE')f.wife=ref;else if(tag==='CHIL'&&ref)f.chil.push(ref);}}}
  return {indis,fams};}
function gedcomToMembers(parsed){const {indis,fams}=parsed;const idmap={},out=[];
  Object.values(indis).forEach(I=>{const nid=uid();idmap[I.id]=nid;
    out.push({id:nid,name:I.name||'(không tên)',gender:I.sex||'Nam',birthYear:I.by||'',deathYear:I.dy||'',parentId:'',spouseId:'',src:'gedcom',updatedAt:Date.now()});});
  const byNid={};out.forEach(m=>byNid[m.id]=m);
  fams.forEach(f=>{const h=idmap[f.husb],w=idmap[f.wife];
    if(h&&w&&byNid[h]&&byNid[w]){byNid[h].spouseId=w;byNid[w].spouseId=h;}
    const parent=h||w;f.chil.forEach(c=>{const cid=idmap[c];if(cid&&byNid[cid]&&parent)byNid[cid].parentId=parent;});});
  return out;}
let pendingGed=null;
function loadGEDCOM(e){if(needAuth()){e.target.value='';return;}
  const f=e.target.files&&e.target.files[0];if(!f)return;

  }catch(err){toast('Lỗi đọc GEDCOM: '+((err&&err.message)||err));}};
  r.readAsText(f,'utf-8');e.target.value='';}

  for(let i=0;i<days;i++){const d=new Date(base);d.setDate(base.getDate()+i);
    const r=convertSolar2Lunar(d.getDate(),d.getMonth()+1,d.getFullYear(),TZ);

    if(fest){label=fest;type='fest';}else if(r[0]===15){label='Ngày Rằm tháng '+r[1];type='ram';}

let _upGioCache={},_upGioDay='';
function upcomingGio(daysAhead){

  if(_upGioDay!==_dayKey){_upGioCache={};_upGioDay=_dayKey;}
  const _seen=new Set();members.forEach(m=>{
    if(_seen.has(m.id))return;_seen.add(m.id);
    if(!m.gioDay||!m.gioMonth)return;
    const _k=(m.gioType||'am')+'|'+m.gioDay+'|'+m.gioMonth;
    let found;
    if(_k in _upGioCache){found=_upGioCache[_k]?new Date(_upGioCache[_k]):null;}
    else{
      found=null;

}

function buildGroupedTree(){

    ks.forEach(k=>{rendered.add(k.id);markSub(k);});}

    if(rendered.has(m.id))return '';rendered.add(m.id);if(lvl>maxLvl)maxLvl=lvl;
    const spouse=m.spouseId?members.find(x=>x.id===m.spouseId):null;
    if(spouse)rendered.add(spouse.id);
    const kids=(spouse?_kidsOf(m.id).concat(_kidsOf(spouse.id)):_kidsOf(m.id)).filter(x=>!rendered.has(x.id));
    const collapsed=collapsedNodes.has(m.id);
    let kidHTML='';

function ancestorsList(id){const out=[];let cur=members.find(x=>x.id===id),g=0;const seen=new Set();

function relationship(aId,bId){

  const a=ca.indexOf(lca),b=cb.indexOf(lca);
  const lcaName=(members.find(x=>x.id===lca)||{}).name;
  const by=m=>m&&m.birthYear?+m.birthYear:null;
  const ancTerm=(n,g)=>n===1?(g==='Nữ'?'mẹ':'cha'):n===2?(g==='Nữ'?'bà':'ông'):n===3?(g==='Nữ'?'cụ bà':'cụ ông'):n===4?(g==='Nữ'?'bà kỵ':'ông kỵ'):'tổ tiên';
  const descTerm=n=>n===1?'con':n===2?'cháu':n===3?'chắt':n===4?'chút':'hậu duệ';
  // self gọi other (anh/chị/em theo tuổi)
  const sibTerm=(self,other,distant)=>{const suf=distant?' họ':'';const ys=by(self),yo=by(other);
    if(ys&&yo&&ys!==yo)return (yo<ys?(other.gender==='Nữ'?'chị':'anh'):'em')+suf;
    return 'anh/chị/em'+suf;};
  // younger gọi elder (bác/chú/cô theo tuổi của elder so với cha/mẹ younger)
  const uncleTerm=(elder,yParent,distant)=>{const suf=distant?' họ':'';const e=by(elder),pp=by(yParent);
    const older=(e&&pp)?(e<pp):null; // elder sinh trước cha/mẹ younger => vai bác
    if(elder.gender==='Nữ')return (older===true?'bác (gái)':older===false?'cô':'bác/cô')+suf;
    return (older===true?'bác':older===false?'chú':'bác/chú')+suf;};
  let ab,ba,note='';

    `<rect x="${bx}" y="${by}" width="${bw}" height="${bh}" rx="6" fill="url(#pdred)" stroke="${GOLD}" stroke-width="2.5"/><rect x="${bx+5}" y="${by+5}" width="${bw-10}" height="${bh-10}" rx="4" fill="none" stroke="${GOLD}" stroke-width="1" opacity=".7"/>`+
    `<text x="${cx}" y="${by+38}" text-anchor="middle" font-size="34" fill="#ffe9b0" font-weight="700" letter-spacing="4">GIA PHẢ</text>`+

  // câu đối
  const vstr=(x,str)=>{let t='',y=TOP-34;str.split(/\s+/).forEach(w=>{t+=`<text x="${x}" y="${y}" text-anchor="middle" font-size="22" fill="${RED}" font-weight="700" font-style="italic">${E(w)}</text>`;y+=34;});return t;};
  deco+=vstr(F+34,PD_COUPLET_L)+vstr(W-F-34,PD_COUPLET_R);
  // footer
  deco+=`<text x="${cx}" y="${H-F-14}" text-anchor="middle" font-size="12" fill="#9a7a4a">Phả đồ tạo bằng ứng dụng Gia Phả Số · ${E(sub)}</text>`;

  const defs=`<defs><linearGradient id="pdgold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f6e3a0"/><stop offset=".5" stop-color="${GOLD}"/><stop offset="1" stop-color="#dcae3e"/></linearGradient><linearGradient id="pdred" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${shade(PD_MAIN,0.16)}"/><stop offset="1" stop-color="${shade(PD_MAIN,-0.22)}"/></linearGradient><radialGradient id="pdpaper" cx="50%" cy="34%" r="72%"><stop offset="0" stop-color="#f7eed6"/><stop offset="1" stop-color="#e6d6b2"/></radialGradient><pattern id="pdhoivan" width="28" height="28" patternUnits="userSpaceOnUse"><rect width="28" height="28" fill="#caa23f"/><rect x="4" y="4" width="20" height="20" fill="none" stroke="#7a4a12" stroke-width="2"/><rect x="10" y="10" width="8" height="8" fill="none" stroke="#7a4a12" stroke-width="1.6"/></pattern></defs>`;

  const out=`<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" font-family="${PD_FONT}">${defs}${deco}${body}</svg>`;

}

function _printSVGs(svgs){

function svgToCanvas(svg,W,H,scale){return new Promise((res,rej)=>{
  const blob=new Blob([svg],{type:'image/svg+xml;charset=utf-8'});const url=URL.createObjectURL(blob);
  const img=new Image();
  img.onload=()=>{try{const cv=document.createElement('canvas');cv.width=Math.round(W*scale);cv.height=Math.round(H*scale);
    const ctx=cv.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,cv.width,cv.height);ctx.drawImage(img,0,0,cv.width,cv.height);
    URL.revokeObjectURL(url);res(cv);}catch(e){URL.revokeObjectURL(url);rej(e);}};
  img.onerror=()=>{URL.revokeObjectURL(url);rej(new Error('Không vẽ được SVG'));};img.src=url;});}
function downloadAllPhaDo(){

}

  const y=calRef.getFullYear(),mo=calRef.getMonth();
  const first=new Date(y,mo,1).getDay(),daysIn=new Date(y,mo+1,0).getDate(),prevDays=new Date(y,mo,0).getDate();

    const ldText=(l.d===1)?(l.d+'/'+l.m):l.d;
    const cls=['day',iso===todayStr?'today':'',has?'has':'',iso===calSel?'sel':'',special,gio].filter(Boolean).join(' ');
    cells+=`<div class="${cls}" onclick="selDay('${iso}')"${fest?` title="${esc(fest)}"`:''}><span class="sd">${d}</span><span class="ld">${ldText}</span></div>`;
  }
  const rest=(7-(first+daysIn)%7)%7;for(let i=1;i<=rest;i++)cells+=`<div class="day out">${i}</div>`;

  const gioUp=upcomingGio(120);

    return `<div class="ev" style="border-left-color:#6f1212">

      <span class="badge">Giỗ</span></div>`;}).join(''):`<p style="color:var(--ink-soft)">Không có ngày giỗ trong 120 ngày tới. Thêm "Ngày giỗ" trong hồ sơ thành viên để được nhắc.</p>`;

  const lunarUp=upcomingLunar(75);
  const lunarHtml=lunarUp.length?lunarUp.map(x=>`
    <div class="ev" style="border-left-color:${x.type==='fest'?'var(--maroon)':(x.type==='ram'?'var(--gold)':'var(--ink-soft)')}">
      <div class="when">${x.date.getDate()}/${x.date.getMonth()+1}<div style="color:var(--muted);font-weight:400;font-size:11px">ÂL ${x.ld}/${x.lm}</div></div>

function yearCanChi(y){return CAN[((y+6)%10+10)%10]+' '+CHI[((y+8)%12+12)%12];}
function yearChiIdx(y){return ((y+8)%12+12)%12;}

function elementOf(s){if(/Kim$/.test(s))return 'Kim';if(/Mộc$/.test(s))return 'Mộc';if(/Thủy$/.test(s))return 'Thủy';if(/Hỏa$/.test(s))return 'Hỏa';return 'Thổ';}
function digitRoot(n){n=Math.abs(parseInt(n)||0);while(n>9){n=String(n).split('').reduce((a,c)=>a+(+c),0);}return n;}
function kuaNumber(y,gender){let s=digitRoot(String(y).split('').reduce((a,c)=>a+(+c),0));let k;
  if(gender==='Nữ'){k=s+4;if(k>9)k=digitRoot(k);if(k===5)k=8;}else{k=11-s;if(k>9)k=digitRoot(k);if(k===10)k=1;if(k===5)k=2;}return k;}
function lifePath(d,m,y){let s=(String(d)+String(m)+String(y)).split('').reduce((a,c)=>a+(+c),0);
  while(s>9&&s!==11&&s!==22)s=String(s).split('').reduce((a,c)=>a+(+c),0);return s;}
function fourPillars(d,m,y,h){
  const yc=((y+6)%10+10)%10, ych=((y+8)%12+12)%12;

  const startStem=[2,4,6,8,0][yc%5]; const monthsFromDan=((bIdx-2)+12)%12;
  const mc=(startStem+monthsFromDan)%10;
  const jdn=jdFromDate(d,m,y); const dc=((jdn+9)%10+10)%10, dch=((jdn+1)%12+12)%12;
  let hc=null,hch=null;
  if(h!==''&&h!=null&&!isNaN(h)){hch=Math.floor((((+h+1)%24)+24)%24/2);const st=[0,2,4,6,8][dc%5];hc=(st+hch)%10;}
  return {year:[yc,ych],month:[mc,bIdx],day:[dc,dch],hour:hc!=null?[hc,hch]:null};
}

async function doRegister(){const name=$('ac_name').value.trim(),u=$('ac_user').value.trim(),p=$('ac_pass').value,p2=$('ac_pass2').value;
  if(!name||!u||!p){toast('Vui lòng điền đủ thông tin');return;}
  if(p.length<6){toast('Mật khẩu tối thiểu 6 ký tự');return;}
  if(p!==p2){toast('Mật khẩu nhập lại không khớp');return;}
  if(CLOUD){const {data,error}=await sb.auth.signUp({email:u,password:p,options:{data:{name}}});
    if(error){toast(error.message);return;}
    if(data&&data.session){await loadSession();await reloadData();toast('Tạo tài khoản thành công');render();}
    else{toast('Đã gửi email xác nhận – kiểm tra hộp thư rồi đăng nhập');acctMode='login';render();}
    return;}
  if(accounts.some(a=>a.username.toLowerCase()===u.toLowerCase())){toast('Tên đăng nhập đã tồn tại');return;}
  accounts.push({username:u,passHash:await sha256(p),name});await Store.set('accounts',accounts);
  currentUser={username:u,name};await Store.set('currentUser',currentUser);toast('Tạo tài khoản thành công');render();}
async function doLogin(){const u=$('ac_user').value.trim(),p=$('ac_pass').value;
  if(CLOUD){const {error}=await sb.auth.signInWithPassword({email:u,password:p});
    if(error){toast('Sai email hoặc mật khẩu');return;}
    await loadSession();await reloadData();toast('Đăng nhập thành công');render();return;}
  const h=await sha256(p);
  const a=accounts.find(x=>x.username.toLowerCase()===u.toLowerCase()&&(x.passHash===h||x.password===p));
  if(!a){toast('Sai tên đăng nhập hoặc mật khẩu');return;}
  if(!a.passHash){a.passHash=h;delete a.password;await Store.set('accounts',accounts);}
  currentUser={username:a.username,name:a.name};await Store.set('currentUser',currentUser);toast('Đăng nhập thành công');render();}
async function logout(){if(CLOUD){try{await sb.auth.signOut();}catch(e){}currentUser=null;acctMode='login';render();return;}
  currentUser=null;await Store.set('currentUser',null);acctMode='login';render();}

async function saveMember(id){
  const name=$('m_name').value.trim();if(!name){toast('Vui lòng nhập họ và tên');return;}
  const by=$('m_by').value.trim(),dy=$('m_dy').value.trim();
  if(!validYear(by)){toast('Năm sinh không hợp lệ');return;}
  if(!validYear(dy)){toast('Năm mất không hợp lệ');return;}
  if(by&&dy&&+dy<+by){toast('Năm mất phải sau năm sinh');return;}
  let parentId=$('m_parent').value||'';const spouseId=$('m_spouse').value||'';
  if(parentId&&parentId===id){toast('Không thể chọn chính mình làm cha/mẹ');parentId='';}
  if(parentId&&id&&createsCycle(id,parentId)){toast('Quan hệ này tạo vòng lặp (chọn con/cháu làm cha/mẹ)');return;}
  snapshot();
  const data={name,birthYear:by,deathYear:dy,birthDay:parseInt($('m_bd')?$('m_bd').value:0)||0,birthMonth:parseInt($('m_bm')?$('m_bm').value:0)||0,gender:$('m_gender').value,
    parentId,spouseId,motherId:(($('m_mother')?$('m_mother').value:'')===id?'':($('m_mother')?$('m_mother').value:'')),branch:($('m_branch')?$('m_branch').value.trim():''),gen:($('m_gen')&&$('m_gen').value!=='')?(parseInt($('m_gen').value)||''):'',phone:$('m_phone').value.trim(),nickname:($('m_nick')?$('m_nick').value.trim():''),email:($('m_email')?$('m_email').value.trim():''),zalo:($('m_zalo')?$('m_zalo').value.trim():''),facebook:($('m_fb')?$('m_fb').value.trim():''),address:($('m_address')?$('m_address').value.trim():''),occupation:$('m_job').value.trim(),hometown:$('m_home').value.trim(),grave:$('m_grave').value.trim(),gioPlace:($('m_gioplace')?$('m_gioplace').value.trim():''),
    gioDay:parseInt($('m_gio_d').value)||0,gioMonth:parseInt($('m_gio_m').value)||0,gioType:$('m_gio_t').value,
    notes:$('m_note').value.trim(),avatar:formAvatar,updatedAt:Date.now()};
  let mid=id;
  if(id){const i=members.findIndex(x=>x.id===id);members[i]={...members[i],...data};}
  else{mid=uid();members.push({id:mid,...data});
    if(_addParentForChild){const ci=members.findIndex(x=>x.id===_addParentForChild);
      if(ci>=0&&!createsCycle(_addParentForChild,mid)){const ch=members[ci];members[ci]={...ch,parentId:mid};
        const nm=members.find(x=>x.id===mid);if(nm){if(!nm.branch)nm.branch=ch.branch||'';if(nm.gen===''||nm.gen==null){const cg=ch.gen||genOf(ch);if(cg)nm.gen=cg-1;}}}
      _addParentForChild=null;}
  }
  // vợ/chồng hai chiều
  if(spouseId){members.forEach(x=>{if(x.id!==mid&&x.spouseId===mid&&x.id!==spouseId)x.spouseId='';});
    const sp=members.find(x=>x.id===spouseId);if(sp)sp.spouseId=mid;}
  else{members.forEach(x=>{if(x.spouseId===mid)x.spouseId='';});}
  closeModal();toast(id?'Đã cập nhật':'Đã thêm thành viên');render();commitMembers().catch(function(){});
}

/* ---------- Nhập gia phả nhiều đời (tộc Nguyễn Như) vào cây ---------- */
function doi11Imported(){return members.some(m=>m.src==='doi11');}
function noTone(s){return (s||'').normalize('NFD').replace(/[\u0300\u0301\u0303\u0309\u0323]/g,'').normalize('NFC').toLowerCase();}
function gkey(name){return noTone((name||'').replace(/\(.*?\)/g,'').replace(/tức.*$/,'').trim().split(/\s+/).pop());}
function ekey(name){return (name||'').replace(/\(.*?\)/g,'').replace(/tức.*$/,'').trim().split(/\s+/).pop().toLowerCase();}
function gkeys(name){const ks=[];const base=(name||'').replace(/\(.*?\)/g,'').trim().split(/\s+/).pop();if(base)ks.push(noTone(base));(name.match(/\(([^)]+)\)/g)||[]).forEach(p=>{const t=p.replace(/[()]/g,'').replace(/^tức\s*/i,'').trim().split(/\s+/).pop();if(t)ks.push(noTone(t));});return [...new Set(ks)];}
function wkey(name){return /quý nương$|^thị$|^thị quý nương$/i.test((name||'').trim())?'':gkey(name);}
function lev(a,b){a=a||'';b=b||'';const m=a.length,n=b.length;if(!m)return n;if(!n)return m;const d=Array.from({length:m+1},(_,i)=>[i,...Array(n).fill(0)]);for(let j=0;j<=n;j++)d[0][j]=j;for(let i=1;i<=m;i++)for(let j=1;j<=n;j++)d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));return d[m][n];}
function buildImportMembers(){

/* ---------- Nhập từ văn bản / tệp .txt (người dùng tự dán) ---------- */
function normBranch(s){
  s=s.replace(/\s+/g,' ').trim();
  if(!/PHÁI/i.test(s))return null;
  const phai=(s.match(/PHÁI\s*(\d+)/i)||[])[1];
  const chi=(s.match(/CHI\s*(\d+)/i)||[])[1];
  const nhanh=(s.match(/NH[ÁA]NH\s*(\d+)/i)||[])[1];
  if(!phai)return null;
  let out='Phái '+phai;
  if(chi)out+=' · Chi '+chi;
  if(nhanh)out+=' · Nhánh '+nhanh;
  return out;
}
function roleOf(L){
  L=L.replace(/^[-–•*]\s*/,'');
  if(/^(vợ\s*(thứ|kế|hai|2)|tỷ\s*kế|kế thất)(\s|:|$)/i.test(L))return ['tk',L.replace(/^(vợ\s*(thứ|kế|hai|2)|tỷ\s*kế|kế thất)\s*:?\s*/i,'')];
  if(/^(vợ|tỷ|dâu|con\s*dâu|vk)(\s|:|$)/i.test(L))return ['ty',L.replace(/^(vợ|tỷ|dâu|con\s*dâu|vk)\s*:?\s*/i,'')];
  if(/^(con\s*gái|gái|cg|nữ|cô)(\s|:|$)/i.test(L))return ['co',L.replace(/^(con\s*gái|gái|cg|nữ|cô)\s*:?\s*/i,'')];
  if(/^(con\s*trai|trai|ct|nam|hiển\s*khảo|khảo|con)(\s|:|$)/i.test(L))return ['kh',L.replace(/^(con\s*trai|trai|ct|nam|hiển\s*khảo|khảo|con)\s*:?\s*/i,'')];
  return null;
}
function clanName(n){n=(n||'').trim();return /nguyễn\s+như/i.test(n)?n:('Nguyễn Như '+n);}
function parseFatherHeader(line){
  let m=line.match(/Con\s+ông\s+(.+?)\s+và\s+bà\s+(.*)/i);
  if(m)return {f:m[1].trim(),m:(m[2]||'').split(/\s[-–]\s/)[0].trim()};
  m=line.match(/^(?:Cha|Bố|Ông)\s*[:：]?\s*(.+)$/i);
  if(m){let rest=m[1].trim();
    let fm=rest.match(/^(.*?)\s*[\(（]\s*(?:vợ|bà|vk)\s*[:：]?\s*([^)）]+?)\s*[\)）]\s*$/i);
    if(fm)return {f:fm[1].trim(),m:fm[2].trim()};
    fm=rest.match(/^(.*?)\s*[-–]\s*(?:vợ|bà)\s*[:：]?\s*(.+)$/i);
    if(fm)return {f:fm[1].trim(),m:fm[2].trim()};
    return {f:rest,m:''};
  }
  return null;
}
function splitNameNote(s){
  s=s.replace(/\s+/g,' ').trim();let ky='';
  s=s.replace(/\(\s*K[yỵ]\s*([\d]+\.?[\d]*)\s*\)/i,(_,d)=>{ky=d;return ' ';}).replace(/\s+/g,' ').trim();
  let note='';
  if(/\(\s*VT\s*\)/i.test(s)){note='VT';s=s.replace(/\(\s*VT\s*\)/ig,'').replace(/\s+/g,' ').trim();}
  const pm=s.match(/\(([^)]*(?:có chồng|có vợ|quê|mộ|ở |định cư|tái giá|khuyết tật|hiệu|sinh|xuất gia|cư trú|gốc|con bà|đi |GĐ|gia đình)[^)]*)\)/i);
  if(pm){const extra=pm[1].trim();s=(s.slice(0,pm.index)+s.slice(pm.index+pm[0].length)).replace(/\s+/g,' ').trim();note=note?(note+' · '+extra):extra;}
  const m=s.match(/\s(có chồng|có vợ|quê |mộ |ở |GĐ|gia đình|định cư|tái giá|khuyết tật|hiệu |sinh |xuất gia|cư trú|gốc |con bà|đi )/i);
  if(m){const extra=s.slice(m.index).trim();s=s.slice(0,m.index).trim();note=note?(note+' · '+extra):extra;}
  return {name:s,ky,note};
}
function parseBook(text){
  const lines=text.split(/\r?\n/);const fams=[];let branch=null,gen=null,cur=null;
  for(const raw of lines){const line=raw.trim();if(!line)continue;

    const dm=line.match(/ĐỜI(?:\s*TH[ỨU])?\s*(\d+)/i);if(dm){gen=parseInt(dm[1]);consumed=true;}
    if(/PHÁI/i.test(line)&&!/Con\s+ông/i.test(line)){const nb=normBranch(line);if(nb){branch=nb;consumed=true;}}
    if(consumed)continue;
    const fh=parseFatherHeader(line);

    const r=roleOf(line);if(r&&cur){const {name,ky,note}=splitNameNote(r[1]);if(name)cur.k.push([r[0],name,ky,note]);}

function _loadScript(src){return new Promise((res,rej)=>{
  _loadScript._c=_loadScript._c||{};
  if(_loadScript._c[src])return res();
  const s=document.createElement('script');s.src=src;s.async=true;
  s.onload=()=>{_loadScript._c[src]=1;res();};
  s.onerror=()=>rej(new Error('Không tải được '+src));
  document.head.appendChild(s);

function _setBookText(t){const ta=$('bookText');if(ta){ta.value=(t||'').toString();try{ta.dispatchEvent(new Event('input'));}catch(e){}}}

let _ocrWorker=null;

async function _extractPdf(file){
  await _loadScript('https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js');
  const pdfjsLib=window.pdfjsLib;
  pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  const buf=await file.arrayBuffer();
  const pdf=await pdfjsLib.getDocument({data:buf}).promise;
  let out='',hasText=false;
  for(let p=1;p<=pdf.numPages;p++){
    toast('Đang đọc PDF trang '+p+'/'+pdf.numPages+'…');
    const page=await pdf.getPage(p);
    const tc=await page.getTextContent();
    const txt=tc.items.map(i=>i.str).join(' ').replace(/\s+\n/g,'\n').trim();
    if(txt){hasText=true;out+=txt+'\n';}
  }
  if(hasText)return out;
  // PDF scan (không có lớp chữ) → OCR từng trang
  toast('PDF là bản scan — chuyển sang nhận dạng chữ (OCR)…');
  out='';
  for(let p=1;p<=pdf.numPages;p++){
    const page=await pdf.getPage(p);
    const vp=page.getViewport({scale:2});
    const c=document.createElement('canvas');c.width=vp.width;c.height=vp.height;
    await page.render({canvasContext:c.getContext('2d'),viewport:vp}).promise;
    toast('OCR trang '+p+'/'+pdf.numPages+'…');

  }

}

  const isDocx=/\.docx$/.test(nm)||/officedocument\.wordprocessingml/.test(f.type);

  try{

}

/* ---------- 2) XUẤT CUỐN GIA PHẢ (WORD .doc) ---------- */
function exportGiaPhaWord(){
  if(!members.length){toast('Chưa có dữ liệu');return;}
  const clan=(typeof PD_CLAN!=='undefined'&&PD_CLAN)?PD_CLAN:'Tộc Nguyễn Như';
  const byId={};members.forEach(m=>byId[m.id]=m);
  const groups={};members.forEach(m=>{const g=m.gen||genOf(m);(groups[g]=groups[g]||[]).push(m);});
  const gens=Object.keys(groups).map(Number).sort((a,b)=>a-b);
  const xe=s=>String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  const run=(t,o)=>{o=o||{};return `<w:r><w:rPr><w:rFonts w:ascii="Times New Roman" w:hAnsi="Times New Roman" w:cs="Times New Roman"/>${o.b?'<w:b/>':''}${o.i?'<w:i/>':''}${o.color?`<w:color w:val="${o.color}"/>`:''}${o.sz?`<w:sz w:val="${o.sz}"/><w:szCs w:val="${o.sz}"/>`:''}</w:rPr><w:t xml:space="preserve">${xe(t)}</w:t></w:r>`;};
  const brk='<w:r><w:br/></w:r>';
  const para=(runs,o)=>{o=o||{};return `<w:p><w:pPr>${o.pb?'<w:pageBreakBefore/>':''}<w:spacing w:before="${o.before||0}" w:after="${o.after||0}" w:line="276" w:lineRule="auto"/>${o.ind?`<w:ind w:left="${o.ind}"/>`:''}${o.align?`<w:jc w:val="${o.align}"/>`:''}</w:pPr>${runs}</w:p>`;};
  let body='';
  body+=para(run('GIA PHẢ',{b:1,color:'8A1818',sz:64}),{align:'center',before:2600,after:120});
  body+=para(run(clan,{b:1,color:'5A2B13',sz:36}),{align:'center',after:300});
  body+=para(run('\u201CN\u01b0\u1edbc c\u00f3 qu\u1ed1c s\u1eed, nh\u00e0 c\u00f3 gia ph\u1ea3.\u201D',{i:1,sz:28}),{align:'center',after:200});
  body+=para(run(members.length+' th\u00e0nh vi\u00ean \u00b7 '+gens.length+' \u0111\u1eddi',{sz:24}),{align:'center',after:120});
  body+=para(run('L\u1eadp ng\u00e0y '+new Date().toLocaleDateString('vi-VN'),{sz:22,color:'7A6A52'}),{align:'center'});
  gens.forEach(g=>{
    body+=para(run('\u0110\u1edcI TH\u1ee8 '+g,{b:1,color:'8A1818',sz:32}),{pb:true,before:120,after:120});
    groups[g].slice().sort((a,b)=>a.name.localeCompare(b.name,'vi')).forEach(m=>{
      const sp=m.spouseId?byId[m.spouseId]:null,par=m.parentId?byId[m.parentId]:null;
      const kids=members.filter(x=>x.parentId===m.id);
      const yrs=[m.birthYear,m.deathYear].filter(Boolean).join(' \u2013 ');
      const gio=m.gioDay?(m.gioDay+'/'+m.gioMonth+(m.gioType==='duong'?' (d\u01b0\u01a1ng l\u1ecbch)':' (\u00e2m l\u1ecbch)')):'';
      body+=para(run(m.name,{b:1,sz:26,color:'8A1818'})+(yrs?run('  ('+yrs+')',{sz:22,color:'7A6A52'}):''),{before:160,after:30});
      const L=[];
      if(par)L.push(['Con c\u1ee7a: ',par.name]);
      if(sp)L.push(['V\u1ee3/ch\u1ed3ng: ',sp.name]);
      if(kids.length)L.push(['C\u00e1c con: ',kids.map(k=>k.name).join(', ')]);
      if(gio)L.push(['Ng\u00e0y gi\u1ed7: ',gio]);
      if(m.hometown)L.push(['Qu\u00ea qu\u00e1n: ',m.hometown]);
      if(m.occupation)L.push(['Ngh\u1ec1 nghi\u1ec7p: ',m.occupation]);
      if(m.phone)L.push(['\u0110i\u1ec7n tho\u1ea1i: ',m.phone]);
      if(m.address)L.push(['\u0110\u1ecba ch\u1ec9: ',m.address]);
      if(m.grave)L.push(['M\u1ed9 ph\u1ea7n: ',m.grave]);
      if(L.length){let rr='';L.forEach((pr,i)=>{rr+=(i?brk:'')+run(pr[0],{sz:22,color:'9A7A4A'})+run(pr[1],{sz:22});});body+=para(rr,{ind:360,after:30});}
      if(m.notes)body+=para(run(m.notes,{i:1,sz:22}),{ind:360,after:60});
    });
  });
  const docXml='<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<w:document xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main"><w:body>'+body+'<w:sectPr><w:pgSz w:w="11906" w:h="16838"/><w:pgMar w:top="1418" w:right="1418" w:bottom="1418" w:left="1418" w:header="709" w:footer="709" w:gutter="0"/></w:sectPr></w:body></w:document>';
  const ct='<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/></Types>';
  const rels='<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/></Relationships>';
  const enc=new TextEncoder();
  const crcTable=(function(){const t=[];for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=(c&1)?(0xEDB88320^(c>>>1)):(c>>>1);t[n]=c>>>0;}return t;})();
  const crc32=u=>{let c=0xFFFFFFFF;for(let i=0;i<u.length;i++)c=crcTable[(c^u[i])&0xFF]^(c>>>8);return (c^0xFFFFFFFF)>>>0;};
  const u16=n=>[n&255,(n>>8)&255],u32=n=>[n&255,(n>>8)&255,(n>>16)&255,(n>>24)&255];
  const files=[{n:'[Content_Types].xml',d:enc.encode(ct)},{n:'_rels/.rels',d:enc.encode(rels)},{n:'word/document.xml',d:enc.encode(docXml)}];
  const parts=[],central=[];let off=0;
  files.forEach(f=>{const name=enc.encode(f.n),data=f.d,crc=crc32(data);
    parts.push(new Uint8Array([0x50,0x4b,0x03,0x04,...u16(20),...u16(0),...u16(0),...u16(0),...u16(0),...u32(crc),...u32(data.length),...u32(data.length),...u16(name.length),...u16(0)]),name,data);
    central.push(new Uint8Array([0x50,0x4b,0x01,0x02,...u16(20),...u16(20),...u16(0),...u16(0),...u16(0),...u16(0),...u32(crc),...u32(data.length),...u32(data.length),...u16(name.length),...u16(0),...u16(0),...u16(0),...u16(0),...u32(0),...u32(off)]),name);
    off+=30+name.length+data.length;});
  let cdSize=0;central.forEach(c=>cdSize+=c.length);
  const eocd=new Uint8Array([0x50,0x4b,0x05,0x06,...u16(0),...u16(0),...u16(files.length),...u16(files.length),...u32(cdSize),...u32(off),...u16(0)]);
  const all=parts.concat(central,[eocd]);let total=0;all.forEach(a=>total+=a.length);
  const out=new Uint8Array(total);let p=0;all.forEach(a=>{out.set(a,p);p+=a.length;});
  const blob=new Blob([out],{type:'application/vnd.openxmlformats-officedocument.wordprocessingml.document'});
  const url=URL.createObjectURL(blob),a=document.createElement('a');
  a.href=url;a.download='Cuon-gia-pha.docx';document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),1500);
  toast('\u0110\u00e3 xu\u1ea5t cu\u1ed1n gia ph\u1ea3 (.docx) \u2014 m\u1edf \u0111\u01b0\u1ee3c m\u1ecdi n\u01a1i');
}

function resizePhoto(file,cb){const r=new FileReader();r.onload=e=>{const img=new Image();
  img.onload=()=>{const max=1000,sc=Math.min(1,max/Math.max(img.width,img.height));
    const cw=Math.round(img.width*sc),ch=Math.round(img.height*sc);
    const cv=document.createElement('canvas');cv.width=cw;cv.height=ch;cv.getContext('2d').drawImage(img,0,0,cw,ch);
    cb(cv.toDataURL('image/jpeg',0.78));};img.src=e.target.result;};r.readAsDataURL(file);}

function albGuard(){return (typeof needAuth==='function'&&needAuth());}
async function albAddPhotos(id,files){if(albGuard())return;const m=members.find(x=>x.id===id);if(!m)return;m.photos=m.photos||[];
  const arr=Array.from(files);let done=0;if(!arr.length)return;
  arr.forEach(f=>resizePhoto(f,d=>{m.photos.push(d);if(!m.avatar)m.avatar=d;if(++done===arr.length){m.updatedAt=Date.now();commitMembers().then(()=>openAlbum(id));}}));}
async function albAddDocs(id,files){if(albGuard())return;const m=members.find(x=>x.id===id);if(!m)return;m.docs=m.docs||[];
  const arr=Array.from(files);let done=0;if(!arr.length)return;
  arr.forEach(f=>{const r=new FileReader();r.onload=e=>{m.docs.push({name:f.name,data:e.target.result});if(++done===arr.length){m.updatedAt=Date.now();commitMembers().then(()=>openAlbum(id));}};r.readAsDataURL(f);});}
async function albDelPhoto(id,i){if(albGuard())return;const m=members.find(x=>x.id===id);if(!m)return;m.photos.splice(i,1);m.updatedAt=Date.now();openAlbum(id);commitMembers().catch(function(){});}
async function albDelDoc(id,i){if(albGuard())return;const m=members.find(x=>x.id===id);if(!m)return;m.docs.splice(i,1);m.updatedAt=Date.now();openAlbum(id);commitMembers().catch(function(){});}


/* ===== Ngày giỗ / cúng các kiểu + Kết nối database ===== */
function lunarToSolar(ld,lm,ly){
  if(!ld||!lm||!ly)return null;
  const end=new Date(ly+1,2,31);
  for(let d=new Date(ly,0,1); d<=end; d.setDate(d.getDate()+1)){
    const l=convertSolar2Lunar(d.getDate(),d.getMonth()+1,d.getFullYear(),TZ);
    if(l[0]===ld&&l[1]===lm&&l[2]===ly)return new Date(d);
  }
  return null;
}
function nextGioDate(m){
  const base=new Date();base.setHours(0,0,0,0);
  if(!m.gioDay||!m.gioMonth)return null;
  if(m.gioType==='duong'){for(let y=0;y<2;y++){const d=new Date(base.getFullYear()+y,m.gioMonth-1,m.gioDay);if(d>=base)return d;}return null;}
  for(let i=0;i<420;i++){const d=new Date(base);d.setDate(base.getDate()+i);const l=convertSolar2Lunar(d.getDate(),d.getMonth()+1,d.getFullYear(),TZ);if(l[0]===m.gioDay&&l[1]===m.gioMonth)return new Date(d);}
  return null;
}
function _deathSolar(m){
  if(!m.deathYear||!m.gioDay||!m.gioMonth)return null;
  if(m.gioType==='duong')return new Date(+m.deathYear,m.gioMonth-1,m.gioDay);
  return lunarToSolar(m.gioDay,m.gioMonth,+m.deathYear);
}
function _gioInYear(m,year){
  if(!m.gioDay||!m.gioMonth)return null;
  if(m.gioType==='duong')return new Date(year,m.gioMonth-1,m.gioDay);
  return lunarToSolar(m.gioDay,m.gioMonth,year);
}
function cungSection(m){
  if(!isDeceased(m)||!m.gioDay||!m.gioMonth)return '';
  const today=new Date();today.setHours(0,0,0,0);
  const fmt=d=>d?(d.getDate()+'/'+(d.getMonth()+1)+'/'+d.getFullYear()):'—';
  const tag=d=>{if(!d)return '';const diff=Math.round((d-today)/86400000);if(diff<0)return '<span style="color:#b3a585">· đã qua</span>';if(diff===0)return '<span style="color:#8a1818;font-weight:700">· hôm nay</span>';return '<span style="color:#8a6a4a">· còn '+diff+' ngày</span>';};
  const chinh=nextGioDate(m);
  const tien=chinh?new Date(chinh.getFullYear(),chinh.getMonth(),chinh.getDate()-1):null;
  const death=_deathSolar(m);
  const d49=death?new Date(death.getFullYear(),death.getMonth(),death.getDate()+49):null;
  const d100=death?new Date(death.getFullYear(),death.getMonth(),death.getDate()+100):null;
  const gioDau=m.deathYear?_gioInYear(m,+m.deathYear+1):null;
  const gioHet=m.deathYear?_gioInYear(m,+m.deathYear+2):null;
  const row=(label,sub,d)=>d?`<div style="display:flex;justify-content:space-between;align-items:baseline;gap:8px;padding:7px 0;border-bottom:1px solid #eadfc6">
     <div><b style="color:var(--maroon)">${label}</b>${sub?` <span style="font-size:11px;color:#9a7a4a">${sub}</span>`:''}</div>
     <div style="font-size:13px;text-align:right;white-space:nowrap">${fmt(d)} ${tag(d)}</div></div>`:'';
  const rows=[
    row('Cúng tiên thường','tối hôm trước',tien),
    row('Chính kỵ (ngày giỗ)','hằng năm',chinh),
    row('Cúng 49 ngày','Chung thất',d49),
    row('Cúng 100 ngày','Tốt khốc',d100),
    row('Giỗ đầu','Tiểu tường',gioDau),
    row('Giỗ hết','Đại tường',gioHet),
  ].join('');
  if(!rows.trim())return '';
  return `<div class="prof-sec"><h3>🕯️ Các ngày cúng</h3>${rows}
    <div style="font-size:11px;color:#9a7a4a;margin-top:7px">Ngày dương lịch, tự tính từ ngày giỗ ${m.gioType==='duong'?'(dương lịch)':'(âm lịch)'}. Mốc 49/100 ngày & giỗ đầu/hết tính từ năm mất.</div></div>`;
}

function saveDbSettings(){
  const u=($('sbUrl').value||'').trim(),k=($('sbKey').value||'').trim();
  if(!u||!k){toast('Nhập đủ URL và key');return;}
  if(!/^https:\/\/.+\.supabase\.co/.test(u)){toast('URL nên dạng https://xxx.supabase.co');return;}
  try{localStorage.setItem('gps_sb_url',u);localStorage.setItem('gps_sb_key',k);}catch(e){}
  toast('Đã lưu — đang kết nối lại...');setTimeout(()=>location.reload(),700);
}
function clearDbSettings(){
  try{localStorage.removeItem('gps_sb_url');localStorage.removeItem('gps_sb_key');}catch(e){}
  toast('Đã ngắt kết nối đám mây');setTimeout(()=>location.reload(),700);
}

/* ===== Chia sẻ: xuất file HTML chỉ-xem, gắn sẵn dữ liệu ===== */
function exportShare(){
  if(!members.length){toast('Chưa có dữ liệu để chia sẻ');return;}
  try{closeModal();}catch(e){}
  const pd={clan:PD_CLAN,cl:PD_COUPLET_L,cr:PD_COUPLET_R,color:PD_MAIN,font:PD_FONT,bg:PD_BG};
  const data={members,events,phaky:(typeof phaky!=='undefined'?phaky:{}),pd,chart:CHART_CFG};
  let json;try{json=JSON.stringify(data);}catch(e){toast('Dữ liệu quá lớn để chia sẻ');return;}
  json=json.replace(/<\/script/gi,'<\\/script').replace(/\u2028/g,'').replace(/\u2029/g,'');
  const clone=document.documentElement.cloneNode(true);
  const body=clone.querySelector('body');
  if(body){Array.from(body.children).forEach(ch=>{const t=ch.tagName;const keep=(t==='HEADER'||t==='SCRIPT'||t==='NAV'||ch.id==='view'||ch.id==='modal-root'||(ch.classList&&ch.classList.contains('fab')));if(!keep)ch.remove();});
    const v=clone.querySelector('#view');if(v)v.innerHTML='';
    const tb=clone.querySelector('#tabbar');if(tb)tb.innerHTML='';
    const mr=clone.querySelector('#modal-root');if(mr)mr.innerHTML='';}
  const inject='<script>window.__GPS_SHARE__='+json+';<\/script>';
  let src='<!DOCTYPE html>\n'+clone.outerHTML;
  src=src.indexOf('</head>')>=0?src.replace('</head>',inject+'\n</head>'):inject+src;
  const blob=new Blob([src],{type:'text/html;charset=utf-8'});
  const url=URL.createObjectURL(blob),a=document.createElement('a');
  a.href=url;a.download='gia-pha-chia-se.html';document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),2000);
  toast('Đã tạo file chia sẻ — gửi cho người thân, mở bằng trình duyệt');
}

/* ===== Dọn người trùng (do nhập gia phả nhiều lần) ===== */
function findDupes(){
  const sig=m=>noTone((m.name||'').trim().toLowerCase())+'|'+(m.birthYear||'')+'|'+(m.deathYear||'')+'|'+(m.gioDay||'')+'/'+(m.gioMonth||'');
  const by={};members.forEach(m=>{if(!m.name)return;const s=sig(m);(by[s]=by[s]||[]).push(m);});
  return Object.values(by).filter(g=>g.length>1);
}
function openDupeTool(){
  const groups=findDupes();
  let html=pdHead('dupeRoot','🧹 Dọn người trùng');
  if(!groups.length){html+='<div style="padding:34px;text-align:center;color:#2f6b3a;font-weight:600">✅ Không tìm thấy người trùng.<br>Dữ liệu sạch!</div>';pdOverlay('dupeRoot',html);return;}
  const extra=groups.reduce((s,g)=>s+g.length-1,0);
  html+=`<div style="padding:10px 14px 4px;color:#8a3a1a;font-size:13px">Tìm thấy <b>${groups.length}</b> nhóm trùng (<b>${extra}</b> bản ghi thừa). Khi gộp, app giữ lại 1 người và tự chuyển con cháu / vợ-chồng về người đó.</div>
  <div style="padding:8px 14px"><button onclick="mergeAllDupes()" style="width:100%;padding:13px;border:none;border-radius:10px;background:#8a1818;color:#fff;font-weight:700;font-size:15px;cursor:pointer">⚡ Gộp tất cả (${groups.length} nhóm)</button></div>
  <div style="padding:2px 14px 28px">`;
  groups.forEach((g,i)=>{const m0=g[0];const yrs=[m0.birthYear,m0.deathYear].filter(Boolean).join('–');
    html+=`<div style="margin-top:12px;border:1px solid #e6d6b2;border-radius:12px;padding:11px 13px;background:#fff">
      <div style="font-weight:700;color:#8a1818">${esc(m0.name)} <span style="font-weight:500;color:#8a6a4a;font-size:12px">${yrs?'· '+yrs:''}${m0.gioDay?' · giỗ '+m0.gioDay+'/'+m0.gioMonth:''}</span></div>
      <div style="font-size:12px;color:#7a5a3a;margin:4px 0 9px"><b>${g.length}</b> bản ghi trùng · đời ${[...new Set(g.map(x=>x.gen||genOf(x)))].join(', ')}${m0.branch?' · '+esc(m0.branch):''}</div>
      <button onclick="mergeOneDupe(${i})" style="padding:8px 14px;border:1px solid #c9982f;border-radius:9px;background:#f6ead9;font-weight:600;color:#5a3a22;cursor:pointer">Gộp lại còn 1</button>
    </div>`;});
  html+='</div>';
  window.__dupeGroups=groups;
  pdOverlay('dupeRoot',html);
}
function mergeOneDupe(i){const g=(window.__dupeGroups||[])[i];if(!g)return;_doMerge([g]);openDupeTool();}
function mergeAllDupes(){const g=window.__dupeGroups||findDupes();_doMerge(g);openDupeTool();}
function _doMerge(groups){
  if(typeof snapshot==='function')snapshot();
  groups.forEach(g=>{const keep=g[0].id;const rm=new Set(g.slice(1).map(x=>x.id));
    members.forEach(m=>{if(m.parentId&&rm.has(m.parentId))m.parentId=keep;if(m.spouseId&&rm.has(m.spouseId))m.spouseId=keep;});
    members=members.filter(m=>!rm.has(m.id));});
  try{Store.set('members',members);}catch(e){}
  if(typeof clearGenCache==='function')clearGenCache();
  render();toast('Đã gộp người trùng');
}




/* ===== Sao lưu tự động: chụp khi mở app, giữ 5 bản gần nhất ===== */
function _readSnaps(){try{const a=JSON.parse(localStorage.getItem('gps_snaps'));return Array.isArray(a)?a:[];}catch(e){return [];}}
function _writeSnaps(arr){
  try{localStorage.setItem('gps_snaps',JSON.stringify(arr));return true;}catch(e){}
  // hết dung lượng: bỏ ảnh trong từng bản rồi thử lại
  try{const slim=arr.map(s=>({ts:s.ts,events:s.events,phaky:s.phaky,slim:true,members:(s.members||[]).map(m=>{const c=Object.assign({},m);delete c.avatar;delete c.photos;delete c.docs;return c;})}));
    localStorage.setItem('gps_snaps',JSON.stringify(slim));return true;}catch(e2){return false;}
}
function pushSnap(){
  if(window.__READONLY__||!members.length)return;
  const arr=_readSnaps();
  const last=arr[arr.length-1];
  // bỏ qua nếu vừa chụp dưới 60 giây (tránh trùng khi tải lại nhanh)
  if(last&&(Date.now()-last.ts)<60000)return;
  arr.push({ts:Date.now(),members,events,phaky:(typeof phaky!=='undefined'?phaky:{})});
  while(arr.length>5)arr.shift();
  _writeSnaps(arr);
}
function autoSnapInfo(){const a=_readSnaps();return a.length?a[a.length-1]:null;}
function openRestoreSnaps(){
  const arr=_readSnaps().slice().reverse();
  let html=pdHead('snapRoot','🛡️ Bản an toàn tự động');
  if(!arr.length){html+='<div style="padding:30px;text-align:center;color:#7a5a3a">Chưa có bản tự động nào.</div>';pdOverlay('snapRoot',html);return;}
  html+='<div style="padding:9px 14px 4px;color:#8a6a4a;font-size:12.5px;line-height:1.5">App tự chụp một bản mỗi khi bạn mở app (giữ 5 bản gần nhất, trên máy này). Nếu lỡ sửa/xoá nhầm, chọn một bản trước đó để phục hồi.</div><div style="padding:4px 12px 28px">';
  arr.forEach((s,idx)=>{const realIdx=_readSnaps().length-1-idx;
    html+=`<div style="display:flex;align-items:center;gap:10px;padding:11px 4px;border-bottom:1px solid #f0e6cf">
      <div style="flex:1"><div style="font-weight:600;font-size:13.5px">${new Date(s.ts).toLocaleString('vi-VN')}</div>
      <div style="font-size:11.5px;color:#8a6a4a">${(s.members||[]).length} người${(s.events||[]).length?' · '+s.events.length+' sự kiện':''}${s.slim?' · (không gồm ảnh)':''}${idx===0?' · mới nhất':''}</div></div>
      <button onclick="restoreSnap(${realIdx})" style="padding:7px 13px;border:none;border-radius:9px;background:#8a1818;color:#fff;font-size:12.5px;cursor:pointer;white-space:nowrap">Phục hồi</button></div>`;});
  html+='</div>';
  pdOverlay('snapRoot',html);
}
async function restoreSnap(idx){
  const s=_readSnaps()[idx];if(!s){toast('Không tìm thấy bản này');return;}
  const ws=new Date(s.ts).toLocaleString('vi-VN');
  if(!confirm('Phục hồi dữ liệu về bản lúc '+ws+' ('+(s.members||[]).length+' người)?\n\nDữ liệu hiện tại sẽ được thay. Vẫn Hoàn tác được sau đó.'))return;
  if(typeof snapshot==='function')snapshot();
  if(Array.isArray(s.members))members=JSON.parse(JSON.stringify(s.members));
  if(Array.isArray(s.events))events=JSON.parse(JSON.stringify(s.events));
  if(s.phaky&&typeof s.phaky==='object')phaky={...(typeof DEFAULT_PHAKY!=='undefined'?DEFAULT_PHAKY:{}),...s.phaky};
  await Store.set('members',members);await Store.set('events',events);
  if(typeof phaky!=='undefined')await Store.set('phaky',phaky);
  if(typeof clearGenCache==='function')clearGenCache();
  closePdOverlay('snapRoot');closePdOverlay('toolsRoot');render();
  toast('Đã phục hồi bản '+ws+(s.slim?' (không gồm ảnh)':''));
}

/* ===== GEDCOM (chuẩn phả hệ) — xuất & nhập ===== */
function _gedFamilies(){
  const byId={};members.forEach(m=>byId[m.id]=m);
  const fams=[];const k2i={};
  const ck=(a,bb)=>[a,bb].filter(Boolean).sort().join('|');
  const seen=new Set();
  members.forEach(m=>{const s=m.spouseId;if(s&&byId[s]){const k=ck(m.id,s);if(!seen.has(k)){seen.add(k);k2i[k]=fams.length;const f={husb:null,wife:null,chil:[]};const setHW=p=>{if(p.gender==='Nữ'){if(!f.wife)f.wife=p.id;else if(!f.husb)f.husb=p.id;}else{if(!f.husb)f.husb=p.id;else if(!f.wife)f.wife=p.id;}};setHW(m);setHW(byId[s]);fams.push(f);}}});
  members.forEach(c=>{const p=c.parentId&&byId[c.parentId];if(!p)return;let k;if(p.spouseId&&byId[p.spouseId])k=ck(p.id,p.spouseId);else k='S|'+p.id;
    if(!(k in k2i)){k2i[k]=fams.length;const f={husb:null,wife:null,chil:[]};if(p.gender==='Nữ')f.wife=p.id;else f.husb=p.id;fams.push(f);}
    fams[k2i[k]].chil.push(c.id);});
  return fams;
}
function exportGedcom(){
  if(!members.length){toast('Chưa có dữ liệu để xuất');return;}
  const idmap={};members.forEach((m,i)=>idmap[m.id]='I'+(i+1));
  const fams=_gedFamilies();const famId=fams.map((_,i)=>'F'+(i+1));
  const famsOf={},famcOf={};
  fams.forEach((f,i)=>{if(f.husb)(famsOf[f.husb]=famsOf[f.husb]||[]).push(famId[i]);if(f.wife)(famsOf[f.wife]=famsOf[f.wife]||[]).push(famId[i]);f.chil.forEach(c=>famcOf[c]=famId[i]);});
  const clean=s=>(s||'').replace(/\r?\n/g,' ');
  let g='0 HEAD\n1 SOUR GiaPhaSo\n2 NAME Gia Pha So\n1 GEDC\n2 VERS 5.5.1\n2 FORM LINEAGE-LINKED\n1 CHAR UTF-8\n1 LANG Vietnamese\n';
  members.forEach(m=>{
    g+='0 @'+idmap[m.id]+'@ INDI\n';
    g+='1 NAME '+clean(m.name)+'\n';
    if(m.gender)g+='1 SEX '+(m.gender==='Nam'?'M':(m.gender==='Nữ'?'F':'U'))+'\n';
    if(m.birthYear){g+='1 BIRT\n2 DATE '+m.birthYear+'\n';}
    if(m.deathYear){g+='1 DEAT\n2 DATE '+m.deathYear+'\n';}
    if(m.occupation)g+='1 OCCU '+clean(m.occupation)+'\n';
    if(m.hometown)g+='1 RESI\n2 PLAC '+clean(m.hometown)+'\n';
    const extra=[];
    if(m.branch)extra.push('Nhánh/Phái: '+m.branch);
    if(m.gioDay)extra.push('Ngày giỗ: '+m.gioDay+'/'+m.gioMonth+(m.gioType==='duong'?' (DL)':' (ÂL)'));
    if(m.grave)extra.push('Mộ phần: '+m.grave);
    if(m.phone)extra.push('Điện thoại: '+m.phone);
    if(m.address)extra.push('Địa chỉ: '+m.address);
    const note=[(m.notes||'').trim(),extra.join(' · ')].filter(Boolean).join('\n');
    if(note){const ls=note.split(/\r?\n/);g+='1 NOTE '+ls[0]+'\n';for(let i=1;i<ls.length;i++)g+='2 CONT '+ls[i]+'\n';}
    (famsOf[m.id]||[]).forEach(fid=>g+='1 FAMS @'+fid+'@\n');
    if(famcOf[m.id])g+='1 FAMC @'+famcOf[m.id]+'@\n';
  });
  fams.forEach((f,i)=>{g+='0 @'+famId[i]+'@ FAM\n';if(f.husb)g+='1 HUSB @'+idmap[f.husb]+'@\n';if(f.wife)g+='1 WIFE @'+idmap[f.wife]+'@\n';f.chil.forEach(c=>g+='1 CHIL @'+idmap[c]+'@\n');});
  g+='0 TRLR\n';
  const blob=new Blob([g],{type:'text/plain;charset=utf-8'});const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);a.download='gia-pha.ged';document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),1500);
  toast('Đã xuất file GEDCOM (.ged) — mở được bằng mọi phần mềm phả hệ');
}
function importGedcom(text){
  const lines=String(text).split(/\r?\n/);
  const indi={},fam={};let cur=null,curType=null,sub=null;
  lines.forEach(raw=>{
    const line=raw.replace(/^\uFEFF/,'').replace(/\s+$/,'');if(!line)return;
    const mlv=line.match(/^(\d+)\s+(.*)$/);if(!mlv)return;
    const level=+mlv[1];const rest=mlv[2];
    if(level===0){sub=null;const mp=rest.match(/^@([^@]+)@\s+(\w+)/);
      if(mp&&mp[2]==='INDI'){cur=mp[1];curType='INDI';indi[cur]={id:cur,name:'',gender:'',birthYear:'',deathYear:'',occupation:'',hometown:'',notes:''};}
      else if(mp&&mp[2]==='FAM'){cur=mp[1];curType='FAM';fam[cur]={husb:'',wife:'',chil:[]};}
      else{cur=null;curType=null;}return;}
    if(!cur)return;
    const sp=rest.indexOf(' ');const tag=sp<0?rest:rest.slice(0,sp);const val=(sp<0?'':rest.slice(sp+1)).trim();
    if(curType==='INDI'){const o=indi[cur];
      if(level===1){sub=tag;
        if(tag==='NAME')o.name=(val.replace(/\//g,' ').replace(/\s+/g,' ')).trim();
        else if(tag==='SEX')o.gender=val==='M'?'Nam':(val==='F'?'Nữ':'');
        else if(tag==='OCCU')o.occupation=val;
        else if(tag==='NOTE')o.notes=val;}
      else if(level>=2){
        if(tag==='DATE'){const y=(val.match(/\d{4}/)||[''])[0];if(sub==='BIRT')o.birthYear=y;else if(sub==='DEAT')o.deathYear=y;}
        else if(tag==='PLAC'&&sub==='RESI'&&!o.hometown)o.hometown=val;
        else if(tag==='CONT'||tag==='CONC')o.notes=(o.notes||'')+(tag==='CONT'?'\n':'')+val;}
    } else if(curType==='FAM'){const f=fam[cur];const ref=(val.match(/@([^@]+)@/)||[])[1];
      if(tag==='HUSB')f.husb=ref;else if(tag==='WIFE')f.wife=ref;else if(tag==='CHIL'&&ref)f.chil.push(ref);}
  });
  const newId={};const out=[];let n=0;const stamp=Date.now().toString(36);
  Object.values(indi).forEach(o=>{const id='g'+stamp+(n++);newId[o.id]=id;
    out.push({id,name:o.name||'(không tên)',gender:o.gender||'',birthYear:o.birthYear||'',deathYear:o.deathYear||'',parentId:'',spouseId:'',branch:'',occupation:o.occupation||'',hometown:o.hometown||'',address:'',phone:'',grave:'',gioDay:'',gioMonth:'',gioType:'am',notes:(o.notes||'').trim(),photos:[],docs:[],updatedAt:Date.now()});});
  const byNew={};out.forEach(m=>byNew[m.id]=m);
  Object.values(fam).forEach(f=>{const h=newId[f.husb],w=newId[f.wife];
    if(h&&w){if(byNew[h])byNew[h].spouseId=w;if(byNew[w])byNew[w].spouseId=h;}
    const par=h||w;if(par)f.chil.forEach(cid=>{const c=newId[cid];if(c&&byNew[c])byNew[c].parentId=par;});});
  return out;
}
function pickGedcom(){
  if(typeof needAuth==='function'&&needAuth())return;
  const inp=document.createElement('input');inp.type='file';inp.accept='.ged,.gedcom,text/plain';
  inp.onchange=function(){const f=inp.files&&inp.files[0];if(!f)return;const r=new FileReader();
    r.onload=function(e){let imp;try{imp=importGedcom(e.target.result);}catch(err){toast('File GEDCOM không đọc được');return;}
      if(!imp.length){toast('Không tìm thấy người nào trong file');return;}
      if(!confirm('Tìm thấy '+imp.length+' người trong file GEDCOM.\n\nNhập sẽ THAY THẾ dữ liệu hiện tại bằng dữ liệu trong file. Bản an toàn tự động vẫn được giữ (có thể Hoàn tác).\n\nTiếp tục?'))return;
      if(typeof snapshot==='function')snapshot();
      members=imp;Store.set('members',members);
      if(typeof clearGenCache==='function')clearGenCache();
      try{closePdOverlay('toolsRoot');}catch(e){}
      render();toast('Đã nhập '+imp.length+' người từ GEDCOM');};
    r.readAsText(f,'utf-8');};
  inp.click();
}


/* ===== Giỗ âm lịch -> ngày dương lịch năm nay (tự cập nhật theo năm) ===== */
let _gioSolarCache={};
function gioSolarThisYear(m){
  if(!m||!m.gioDay||!m.gioMonth)return null;
  const yr=new Date().getFullYear();
  if(m.gioType==='duong'){try{return new Date(yr,m.gioMonth-1,m.gioDay);}catch(e){return null;}}
  const key=m.gioDay+'_'+m.gioMonth+'_'+yr;
  if(key in _gioSolarCache)return _gioSolarCache[key]?new Date(_gioSolarCache[key]):null;
  let found=null;
  for(let i=0;i<366;i++){const d=new Date(yr,0,1+i);const l=convertSolar2Lunar(d.getDate(),d.getMonth()+1,d.getFullYear(),TZ);if(l[0]===m.gioDay&&l[1]===m.gioMonth&&!l[3]){found=d;break;}}
  if(!found){for(let i=0;i<366;i++){const d=new Date(yr,0,1+i);const l=convertSolar2Lunar(d.getDate(),d.getMonth()+1,d.getFullYear(),TZ);if(l[0]===m.gioDay&&l[1]===m.gioMonth){found=d;break;}}}
  _gioSolarCache[key]=found?found.getTime():0;
  return found;
}
function fmtViDate(d){const wd=['Chủ nhật','Thứ Hai','Thứ Ba','Thứ Tư','Thứ Năm','Thứ Sáu','Thứ Bảy'][d.getDay()];return wd+', '+d.getDate()+'/'+(d.getMonth()+1)+'/'+d.getFullYear();}


/* ===== Phả đồ -> PDF tải về (không cần mạng, không dùng window.print) ===== */
function _b64ToBytes(b64){const bin=atob(b64);const len=bin.length;const u=new Uint8Array(len);for(let i=0;i<len;i++)u[i]=bin.charCodeAt(i);return u;}
function _imgsToPdfBlob(imgs){
  const chunks=[];let offset=0;const objOffset={};
  const enc=(s)=>new TextEncoder().encode(s);
  const push=(u8)=>{chunks.push(u8);offset+=u8.length;};
  const pushStr=(s)=>push(enc(s));
  const N=imgs.length;const totalObjs=2+N*3;
  pushStr('%PDF-1.4\n');
  push(new Uint8Array([0x25,0xE2,0xE3,0xCF,0xD3,0x0A])); // binary marker
  const writeObj=(num,head,streamBytes)=>{
    objOffset[num]=offset;
    pushStr(num+' 0 obj\n'+head);
    if(streamBytes){pushStr('\nstream\n');push(streamBytes);pushStr('\nendstream');}
    pushStr('\nendobj\n');
  };
  writeObj(1,'<< /Type /Catalog /Pages 2 0 R >>');
  const kids=[];for(let i=0;i<N;i++)kids.push((3+i*3)+' 0 R');
  writeObj(2,'<< /Type /Pages /Kids ['+kids.join(' ')+'] /Count '+N+' >>');
  for(let i=0;i<N;i++){
    const im=imgs[i];const pageNum=3+i*3,contentNum=4+i*3,imgNum=5+i*3;
    const Wp=800,Hp=Math.max(1,Math.round(800*im.h/im.w));
    const content='q '+Wp+' 0 0 '+Hp+' 0 0 cm /Im0 Do Q';
    const cb=enc(content);
    writeObj(pageNum,'<< /Type /Page /Parent 2 0 R /MediaBox [0 0 '+Wp+' '+Hp+'] /Resources << /XObject << /Im0 '+imgNum+' 0 R >> >> /Contents '+contentNum+' 0 R >>');
    writeObj(contentNum,'<< /Length '+cb.length+' >>',cb);
    writeObj(imgNum,'<< /Type /XObject /Subtype /Image /Width '+im.w+' /Height '+im.h+' /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length '+im.bytes.length+' >>',im.bytes);
  }
  const xrefOffset=offset;
  let xref='xref\n0 '+(totalObjs+1)+'\n0000000000 65535 f \n';
  for(let n=1;n<=totalObjs;n++){xref+=String(objOffset[n]||0).padStart(10,'0')+' 00000 n \n';}
  pushStr(xref);
  pushStr('trailer\n<< /Size '+(totalObjs+1)+' /Root 1 0 R >>\nstartxref\n'+xrefOffset+'\n%%EOF');
  return new Blob(chunks,{type:'application/pdf'});
}
function _phaDoPagesToPDF(pages,label){
  if(!pages.length){toast('Chưa có dữ liệu phả đồ');return;}
  toast('Đang tạo PDF…');
  const imgs=[];let i=0;
  const finish=function(){
    if(!imgs.length){toast('Không tạo được PDF (nhánh quá lớn, thử Tải PNG/SVG)');return;}
    let blob;try{blob=_imgsToPdfBlob(imgs);}catch(e){toast('Lỗi tạo PDF');return;}
    const url=URL.createObjectURL(blob);
    const name='pha-do-'+((label||'').replace(/[^0-9A-Za-zÀ-ỹ]+/g,'-')||'gia-pha')+'.pdf';
    const a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();
    setTimeout(function(){URL.revokeObjectURL(url);},60000);
    toast('Đã tạo PDF ('+imgs.length+' trang) — xem mục Tải về của trình duyệt');
  };
  const step=function(){
    if(i>=pages.length){finish();return;}
    const pg=pages[i++];const mx=Math.max(pg.w,pg.h)||1180;
    svgToCanvas(pg.svg,pg.w,pg.h,Math.min(2,3200/mx)).then(function(cv){
      try{const b64=cv.toDataURL('image/jpeg',0.85).split(',')[1];if(b64)imgs.push({bytes:_b64ToBytes(b64),w:cv.width,h:cv.height});}catch(e){}
      step();
    }).catch(function(){step();});
  };
  step();
}


/* ===== Danh sách sinh nhật ===== */
function openBirthdayList(){
  const list=members.filter(m=>m.birthDay&&m.birthMonth);
  if(!list.length){pdOverlay('bdayRoot',pdHead('bdayRoot','🎂 Danh sách sinh nhật')+'<div style="padding:26px;text-align:center;color:#8a6a4a;line-height:1.6">Chưa có ai được nhập <b>ngày/tháng sinh</b>.<br>Vào ✏️ Sửa từng người, điền <b>Ngày sinh</b>, rồi danh sách sẽ hiện ở đây.</div>');return;}
  const today=new Date();const ty=today.getFullYear();
  const t0=new Date(ty,today.getMonth(),today.getDate());t0.setHours(0,0,0,0);
  const rows=list.map(m=>{
    let nd=new Date(ty,m.birthMonth-1,m.birthDay);nd.setHours(0,0,0,0);
    if(nd<t0)nd=new Date(ty+1,m.birthMonth-1,m.birthDay);
    const days=Math.round((nd-t0)/86400000);
    return {m,days};
  }).sort((a,b)=>a.days-b.days).map(({m,days})=>{
    const alive=!m.deathYear;
    const age=(alive&&m.birthYear)?(' · '+(ty-(+m.birthYear))+' tuổi'):(m.deathYear?' · đã mất':'');
    const when=days===0?'<b style="color:#b01818">Hôm nay 🎉</b>':(days===1?'Ngày mai':('còn '+days+' ngày'));
    const av=m.avatar?'<img src="'+esc(m.avatar)+'" style="width:38px;height:38px;border-radius:50%;object-fit:cover">':'<div style="width:38px;height:38px;border-radius:50%;background:#f6ead9;display:flex;align-items:center;justify-content:center;font-size:18px">'+(m.gender==='Nữ'?'👩':'👨')+'</div>';
    return '<div onclick="closePdOverlay(\'bdayRoot\');openMemberDetail(\''+m.id+'\')" style="display:flex;gap:10px;align-items:center;padding:9px 12px;border-bottom:1px solid #f0e6cf;cursor:pointer">'+av+
      '<div style="flex:1"><div style="font-weight:600;color:#7a0f0f">'+esc(m.name)+'</div>'+
      '<div style="font-size:12px;color:#8a6a4a">🎂 '+m.birthDay+'/'+m.birthMonth+(m.birthYear?'/'+m.birthYear:'')+' · đời '+(m.gen||genOf(m))+age+'</div></div>'+
      '<div style="font-size:12px;color:#8a6a4a;white-space:nowrap;text-align:right">'+when+'</div></div>';
  }).join('');
  pdOverlay('bdayRoot',pdHead('bdayRoot','🎂 Sinh nhật ('+list.length+' người)')+'<div style="font-size:12px;color:#8a6a4a;padding:8px 12px">Xếp theo sinh nhật gần nhất. Bấm vào một người để xem hồ sơ.</div>'+rows);
}
/* ===== Đường về tổ tiên ===== */
function traceAncestors(id){
  const chain=[];let cur=members.find(x=>x.id===id);let guard=0;
  while(cur&&guard<80){chain.push(cur);cur=cur.parentId?members.find(x=>x.id===cur.parentId):null;guard++;}
  if(!chain.length)return;
  const top=chain.slice().reverse();
  const items=top.map((m,i)=>{
    const isMe=m.id===id;
    const av=m.avatar?'<img src="'+esc(m.avatar)+'" style="width:36px;height:36px;border-radius:50%;object-fit:cover">':'<div style="width:36px;height:36px;border-radius:50%;background:#f6ead9;display:flex;align-items:center;justify-content:center;font-size:17px">'+(m.gender==='Nữ'?'👩':'👨')+'</div>';
    return '<div onclick="closePdOverlay(\'ancRoot\');openMemberDetail(\''+m.id+'\')" style="display:flex;gap:10px;align-items:center;padding:8px 12px;cursor:pointer;'+(isMe?'background:#fff5f5;border:1px solid #f0c9c9;border-radius:10px':'')+'">'+av+
      '<div style="flex:1"><div style="font-weight:'+(isMe?'700':'600')+';color:#7a0f0f">'+esc(m.name)+(isMe?' 👈 người này':'')+'</div>'+
      '<div style="font-size:12px;color:#8a6a4a">đời '+(m.gen||genOf(m))+(m.branch?' · '+esc(m.branch):'')+'</div></div></div>'+
      (i<top.length-1?'<div style="text-align:center;color:#b9892a;font-size:16px;line-height:1">↓</div>':'');
  }).join('');
  const me=members.find(x=>x.id===id);
  pdOverlay('ancRoot',pdHead('ancRoot','🧭 Đường về tổ tiên')+'<div style="font-size:12px;color:#8a6a4a;padding:8px 12px">Từ tổ trên cùng xuống tới <b>'+esc(me?me.name:'')+'</b> — tất cả '+chain.length+' đời.</div>'+items);
}
